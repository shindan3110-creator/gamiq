<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GAMIQ v0.6 - 50 GAME FEED</title>

<style>
:root{
  --bg:#05070c;
  --panel:#0a0e16;
  --text:#f8fbff;
  --muted:#818ca1;
  --cyan:#61eaff;
  --violet:#8466ff;
  --green:#76ffb2;
  --red:#ff4e70;
  --yellow:#ffe46b;
  --line:rgba(255,255,255,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
  background:#05070c;
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
}

body{
  position:fixed;
  inset:0;
}

button{
  font:inherit;
}

.app{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
  gap:16px;
  padding:16px;
  background:
    radial-gradient(circle at 10% 0%,rgba(132,102,255,.16),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(97,234,255,.10),transparent 25%),
    #05070c;
}

.main{
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.header{
  height:54px;
  flex:0 0 54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:24px;
  font-weight:1000;
  letter-spacing:.15em;
}

.brand span{
  color:var(--cyan);
}

.live{
  display:flex;
  gap:22px;
  align-items:center;
}

.live-block{
  text-align:right;
}

.live-label{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  letter-spacing:.16em;
}

.live-value{
  display:block;
  font-size:20px;
  font-weight:1000;
}

.feed{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:30px;
  background:#080c13;
  box-shadow:
    0 28px 70px rgba(0,0,0,.46),
    inset 0 1px 0 rgba(255,255,255,.04);
  touch-action:none;
}

.feed.shake{
  animation:shake .14s linear;
}

@keyframes shake{
  25%{transform:translate(-2px,1px)}
  50%{transform:translate(2px,-1px)}
  75%{transform:translate(-1px,-1px)}
}

.feed.miss::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:200;
  pointer-events:none;
  background:rgba(255,78,112,.18);
  animation:fade .2s ease-out forwards;
}

@keyframes fade{
  to{opacity:0}
}

.card{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,#0b1019,#070a10);
  will-change:transform,opacity,filter;
}

.card.current{
  transform:translateY(0);
}

.card.next{
  transform:translateY(100%);
}

.card.animating{
  transition:
    transform .34s cubic-bezier(.22,.75,.28,1),
    opacity .34s,
    filter .34s;
}

.card-content{
  width:100%;
  height:100%;
  padding:28px;
  display:flex;
  flex-direction:column;
  position:relative;
}

.card-content::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 70% 25%,var(--themeGlow,rgba(97,234,255,.10)),transparent 32%),
    linear-gradient(135deg,var(--themeA,#0b1019),var(--themeB,#070a10));
  opacity:.95;
}

.card-content>*{
  position:relative;
  z-index:1;
}

.game-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:12px;
}

.game-number{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:.16em;
}

.game-title{
  margin:4px 0 0;
  font-size:clamp(28px,4vw,48px);
  letter-spacing:-.04em;
}

.game-sub{
  margin-top:4px;
  color:#aab4c4;
  font-size:12px;
  font-weight:800;
}

.skill-badge{
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:999px;
  color:#d2dae7;
  font-size:10px;
  font-weight:900;
  letter-spacing:.12em;
  background:rgba(0,0,0,.18);
}

.board{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  background:rgba(4,7,12,.75);
  backdrop-filter:blur(2px);
}

.play{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  padding:22px;
}

.rule{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:rgba(5,8,14,.75);
  backdrop-filter:blur(14px);
}

.rule-inner{
  text-align:center;
  width:min(720px,100%);
}

.rule-label{
  color:var(--cyan);
  font-size:10px;
  font-weight:1000;
  letter-spacing:.22em;
}

.rule-text{
  margin-top:12px;
  font-size:clamp(26px,4vw,48px);
  font-weight:1000;
  line-height:1.3;
}

.rule-icon{
  font-size:60px;
  margin-bottom:16px;
}

.rule-bar{
  width:100px;
  height:3px;
  margin:22px auto 0;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
}

.rule-bar-fill{
  width:0;
  height:100%;
  background:linear-gradient(90deg,var(--violet),var(--cyan));
}

.rule-bar-fill.go{
  animation:rule .9s linear forwards;
}

@keyframes rule{
  to{width:100%}
}

.finish{
  position:absolute;
  inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(5,8,14,.74);
  backdrop-filter:blur(9px);
}

.finish.show{
  display:flex;
}

.finish-score{
  font-size:clamp(64px,10vw,116px);
  font-weight:1000;
  line-height:1;
}

.finish-theme{
  font-size:13px;
  color:#b1bbca;
  font-weight:900;
  margin-top:9px;
}

.swipe-hint{
  margin-top:24px;
  color:#a9b5c8;
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
}

.swipe-arrow{
  display:block;
  font-size:32px;
  animation:arrow .9s ease-in-out infinite;
}

@keyframes arrow{
  50%{transform:translateY(-7px)}
}

.feedback{
  position:absolute;
  z-index:120;
  left:50%;
  top:30%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  font-size:clamp(28px,6vw,62px);
  font-weight:1000;
  animation:pop .48s ease-out forwards;
  text-shadow:0 6px 22px rgba(0,0,0,.5);
}

.feedback.good{
  color:var(--cyan);
}

.feedback.great{
  color:var(--green);
}

.feedback.perfect{
  color:var(--yellow);
}

.feedback.bad{
  color:var(--red);
}

@keyframes pop{
  0%{
    opacity:0;
    transform:translate(-50%,-30%) scale(.6);
  }
  35%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.16);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-85%) scale(.9);
  }
}

.combo{
  position:absolute;
  z-index:115;
  top:16px;
  right:16px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(8,13,21,.82);
  border:1px solid rgba(255,255,255,.1);
  font-size:14px;
  font-weight:1000;
}

.combo strong{
  color:var(--yellow);
}

.world-object{
  font-size:clamp(70px,12vw,150px);
  filter:drop-shadow(0 15px 30px rgba(0,0,0,.35));
  user-select:none;
}

.world-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

.world-label{
  font-size:12px;
  font-weight:900;
  color:#aeb9cb;
  letter-spacing:.1em;
  margin-top:14px;
}

.round-button{
  width:min(30vw,235px);
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  cursor:pointer;
  color:#031218;
  font-size:30px;
  font-weight:1000;
  touch-action:none;
  background:
    radial-gradient(circle at 35% 28%,
    #fff 0 7%,
    #a8f7ff 8%,
    #49d9ee 32%,
    #154958 70%,
    #081319 100%);
  box-shadow:
    0 0 45px rgba(97,234,255,.2),
    inset 0 0 35px rgba(255,255,255,.15);
}

.center{
  text-align:center;
}

.counter{
  display:block;
  margin-bottom:14px;
  font-size:48px;
  font-weight:1000;
}

.message{
  display:block;
  min-height:20px;
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
  font-weight:900;
}

.color-box{
  width:min(42vw,300px);
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.1);
  border-radius:32px;
  background:#141b26;
  cursor:pointer;
  touch-action:none;
}

.color-box.go{
  background:#77ffb1;
  box-shadow:0 0 55px rgba(119,255,177,.45);
}

.color-box.stop{
  background:#ff4e70;
  box-shadow:0 0 55px rgba(255,78,112,.35);
}

.energy{
  width:min(360px,78vw);
  height:11px;
  margin:0 auto 18px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.07);
}

.energy-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--violet),var(--cyan),var(--green));
  transition:width .08s;
}

.alt-grid{
  width:min(700px,100%);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.alt-btn{
  min-height:220px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:25px;
  background:linear-gradient(180deg,#141c29,#090d14);
  color:#fff;
  font-size:29px;
  font-weight:1000;
  touch-action:none;
}

.alt-btn.active{
  border-color:rgba(97,234,255,.5);
  box-shadow:0 0 28px rgba(97,234,255,.16);
}

.choice-wrap{
  display:flex;
  justify-content:center;
  gap:22px;
  align-items:center;
}

.choice{
  width:min(27vw,210px);
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.09);
  border-radius:25px;
  background:linear-gradient(180deg,#151d2b,#090d15);
  color:#fff;
  font-size:clamp(44px,7vw,80px);
  font-weight:1000;
  touch-action:none;
}

.logic-label{
  margin-bottom:17px;
  color:#b0bac9;
  font-size:17px;
  font-weight:900;
}

.memory-grid{
  display:grid;
  grid-template-columns:repeat(3,min(17vw,110px));
  gap:10px;
}

.memory-cell{
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;
  background:#141b27;
  touch-action:none;
}

.memory-cell.demo,
.memory-cell.correct{
  background:#75efff;
  box-shadow:0 0 25px rgba(97,234,255,.55);
  transform:scale(.93);
}

.memory-cell.wrong{
  background:var(--red);
  box-shadow:0 0 25px rgba(255,78,112,.55);
}

.position-grid{
  display:grid;
  grid-template-columns:repeat(4,min(13vw,80px));
  gap:9px;
}

.position-cell{
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.07);
  border-radius:13px;
  background:#131a25;
  touch-action:none;
}

.position-cell.preview{
  background:var(--cyan);
  box-shadow:0 0 22px rgba(97,234,255,.45);
}

.position-cell.correct{
  background:var(--green);
}

.position-cell.wrong{
  background:var(--red);
}

.aim{
  position:absolute;
  inset:0;
  overflow:hidden;
  cursor:none;
  touch-action:none;
}

.crosshair{
  position:absolute;
  z-index:20;
  width:44px;
  height:44px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.crosshair:before,
.crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 7px var(--cyan);
}

.crosshair:before{
  width:44px;
  height:2px;
  left:0;
  top:21px;
}

.crosshair:after{
  width:2px;
  height:44px;
  left:21px;
  top:0;
}

.crosshair-center{
  position:absolute;
  width:13px;
  height:13px;
  left:15.5px;
  top:15.5px;
  border:2px solid var(--cyan);
  border-radius:50%;
  box-shadow:0 0 9px var(--cyan);
}

.target{
  position:absolute;
  width:64px;
  height:64px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  background:
    radial-gradient(circle,
    #fff 0 10%,
    #62eaff 11% 25%,
    #163b4b 26% 43%,
    #8466ff 44% 62%,
    #17132f 63%);
  box-shadow:0 0 25px rgba(97,234,255,.5);
}

.laser{
  position:absolute;
  z-index:15;
  height:4px;
  transform-origin:0 50%;
  pointer-events:none;
  background:linear-gradient(
    90deg,
    rgba(97,234,255,.05),
    #62eaff,
    #fff
  );
  box-shadow:
    0 0 8px var(--cyan),
    0 0 18px rgba(97,234,255,.8);
  animation:laser .18s linear forwards;
}

@keyframes laser{
  to{opacity:0}
}

.impact{
  position:absolute;
  z-index:18;
  width:70px;
  height:70px;
  transform:translate(-50%,-50%);
  border:2px solid var(--cyan);
  border-radius:50%;
  pointer-events:none;
  animation:impact .25s ease-out forwards;
}

.impact.miss{
  border-color:var(--red);
}

@keyframes impact{
  from{
    opacity:1;
    transform:translate(-50%,-50%) scale(.3);
  }
  to{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.6);
  }
}

.mobile-controls{
  display:none;
}

.joystick{
  position:absolute;
  left:18px;
  bottom:18px;
  width:112px;
  height:112px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  background:rgba(255,255,255,.05);
  touch-action:none;
}

.joystick-knob{
  position:absolute;
  width:48px;
  height:48px;
  left:32px;
  top:32px;
  border-radius:50%;
  background:linear-gradient(180deg,#eefaff,#75eaff);
}

.fire{
  position:absolute;
  right:22px;
  bottom:28px;
  width:86px;
  height:86px;
  border:0;
  border-radius:50%;
  background:linear-gradient(180deg,#ff7691,#ff3e63);
  color:#fff;
  font-size:15px;
  font-weight:1000;
  touch-action:none;
}

.side{
  height:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.panel{
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    ),
    #0a0e16;
}

.panel-title{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:.15em;
  margin-bottom:10px;
}

.gamiq-big{
  font-size:52px;
  font-weight:1000;
}

.conf-row{
  display:flex;
  justify-content:space-between;
  color:#aeb8c9;
  font-size:11px;
  font-weight:900;
}

.conf-track{
  height:6px;
  margin-top:8px;
  background:rgba(255,255,255,.07);
  border-radius:999px;
  overflow:hidden;
}

.conf-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--violet),var(--cyan));
  transition:width .45s;
}

.skill-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.045);
}

.skill-row:last-child{
  border-bottom:0;
}

.skill-row span{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
}

.skill-row b{
  font-size:17px;
}

.play-count{
  font-size:34px;
  font-weight:1000;
}

.ad{
  flex:1;
  min-height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#586375;
  border-style:dashed;
}

.start-screen{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 20%,rgba(97,234,255,.08),transparent 35%),
    #070a11;
}

.start-inner{
  text-align:center;
  padding:30px;
}

.start-kicker{
  color:var(--cyan);
  font-size:11px;
  font-weight:1000;
  letter-spacing:.23em;
}

.start-title{
  margin:15px 0 20px;
  font-size:clamp(44px,7vw,82px);
  line-height:1.04;
  letter-spacing:-.045em;
}

.start-copy{
  color:#9da9bc;
  line-height:1.8;
  font-size:16px;
}

.start-btn{
  margin-top:25px;
  min-width:210px;
  min-height:60px;
  border:0;
  border-radius:17px;
  background:linear-gradient(180deg,#c5f9ff,#62e5f7);
  color:#031014;
  font-weight:1000;
  font-size:18px;
}

@media(max-width:900px){

  .app{
    display:block;
    padding:0;
  }

  .main{
    width:100%;
    height:100%;
    gap:0;
  }

  .header{
    height:58px;
    flex:0 0 58px;
    padding:0 14px;
  }

  .brand{
    font-size:20px;
  }

  .live{
    gap:12px;
  }

  .live-value{
    font-size:16px;
  }

  .side{
    display:none;
  }

  .feed{
    flex:1;
    border:0;
    border-radius:0;
    box-shadow:none;
  }

  .card-content{
    padding:14px;
  }

  .game-title{
    font-size:27px;
  }

  .board{
    border-radius:18px;
  }

  .round-button{
    width:min(60vw,235px);
  }

  .choice{
    width:min(40vw,165px);
  }

  .choice-wrap{
    gap:10px;
  }

  .alt-grid{
    gap:9px;
  }

  .alt-btn{
    min-height:200px;
  }

  .memory-grid{
    grid-template-columns:repeat(3,min(27vw,98px));
  }

  .position-grid{
    grid-template-columns:repeat(4,min(20vw,70px));
  }

  .mobile-controls{
    display:block;
  }

  .aim{
    cursor:default;
  }

}
</style>
</head>

<body>

<div class="app">

<main class="main">

<header class="header">

  <div class="brand">
    GAM<span>IQ</span>
  </div>

  <div class="live">

    <div class="live-block">
      <span class="live-label">PLAYED</span>
      <span class="live-value" id="playedTop">0</span>
    </div>

    <div class="live-block">
      <span class="live-label">GAMIQ</span>
      <span class="live-value" id="gamiqTop">---</span>
    </div>

    <div class="live-block">
      <span class="live-label">ACCURACY</span>
      <span class="live-value" id="confidenceTop">0%</span>
    </div>

  </div>

</header>


<section class="feed" id="feed">

  <div class="card current" id="cardA"></div>

  <div class="card next" id="cardB"></div>


  <div class="start-screen" id="startScreen">

    <div class="start-inner">

      <div class="start-kicker">
        50 RANDOM MINI GAMES
      </div>

      <div class="start-title">
        何が来ても、<br>
        上手くやれる？
      </div>

      <div class="start-copy">
        宇宙、ゾンビ、工場、忍者、ネオン、レース、宝探し。<br>
        遊ぶほどGAMIQがあなたの“ゲーム地力”に近づいていく。
      </div>

      <button class="start-btn" id="startBtn">
        START
      </button>

    </div>

  </div>

</section>

</main>


<aside class="side">

  <div class="panel">

    <div class="panel-title">
      LIVE GAMIQ
    </div>

    <div class="gamiq-big" id="gamiqSide">
      ---
    </div>

/* ==========================================
UTIL
========================================== */

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function avg(array){

  return array.length
    ? array.reduce(
        (a,b)=>a+b,
        0
      ) / array.length
    : null;

}


function shuffle(array){

  const a =
    [...array];


  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()
        *(i+1)
      );


    [
      a[i],
      a[j]
    ] =
    [
      a[j],
      a[i]
    ];

  }


  return a;

}


function feedback(
  board,
  text,
  type="good"
){

  const el =
    document.createElement(
      "div"

  el.className =
    `feedback ${type}`;


  el.textContent =

  board.appendChild(
    el
  );


  setTimeout(
    () => el.remove(),
    500
  );

}


function success(
  board,
  combo=1
){

  feed.classList.remove(
    "shake"
  );


  void feed.offsetWidth;


  feed.classList.add(
    "shake"
  );


  if(combo >= 2){

    const c =
      document.createElement(
        "div"
      );


    c.className =
      "combo";


    c.innerHTML =
      `COMBO <strong>×${combo}</strong>`;


    board.appendChild(c);


    setTimeout(
      () => c.remove(),
      650
    );

  }


  feedback(
    board,
    combo >= 7
      ? "PERFECT"
      : combo >= 4
      ? "GREAT"
      : "GOOD",
    combo >= 7
      ? "perfect"
      : combo >= 4
      ? "great"
      : "good"
  );

}


function fail(board){

  feed.classList.remove(
    "miss"
  );


  void feed.offsetWidth;


  feed.classList.add(
    "miss"
  );


  feedback(
    board,
    "MISS",
    "bad"
  );

}


function adaptScore(
  series
){

  if(!series.length){

    return 50;

  }


  if(series.length < 4){

    return clamp(
      35
      + avg(series)*.3,
      25,
      75
    );

  }


  const n =
    Math.max(
      1,
      Math.floor(
        series.length*.35
      )
    );


  return clamp(
    50
    +
    (
      avg(
        series.slice(-n)
      )
      -
      avg(
        series.slice(0,n)
      )
    )*.9,
    0,
    100
  );

}


/* ==========================================
GAME BAG
========================================== */

function getNextGame(){

  if(!bag.length){

    bag =
      shuffle(games);

  }


  let game =
    bag.shift();


  if(
    game.id === lastGameId &&
    bag.length
  ){

    const second =
      bag.shift();


    bag.push(game);


    game =
      second;

  }


  lastGameId =
    game.id;


  return game;

}

/* ==========================================

========================================== */

function cleanupGame(){

  cleanupFns.forEach(
    fn => {

      try{
        fn();
      }
      catch(e){}

    }
  );


  cleanupFns = [];


  if(gameEndTimer){

    clearTimeout(
      gameEndTimer
    );

  }


  gameEndTimer =
    null;

}


function beginCurrentGame(){

  cleanupGame();


  canSwipe =
    false;


  gameActive =
    false;


  const rule =
    currentCard
      .querySelector(
        ".rule"
      );


  const bar =
    currentCard
      .querySelector(
        ".rule-bar-fill"
      );


  rule.style.display =
    "flex";


  bar.classList.remove(
    "go"
  );


  void bar.offsetWidth;


  bar.classList.add(
    "go"
  );


  const timer =
    setTimeout(
      () => {

        rule.style.display =
          "none";


        gameActive =
          true;


        const play =
          currentCard
            .querySelector(
              ".play"
            );


        finishCurrentGame =
          runEngine(
            currentGame,
            play
          );


        gameEndTimer =
          setTimeout(
            finishGame,
            currentGame.duration
          );

      },
      900
    );


  cleanupFns.push(
    () =>
      clearTimeout(timer)
  );

}


function finishGame(){

  if(!gameActive){

    return;

  }


  gameActive =
    false;


  const result =
    finishCurrentGame
      ? finishCurrentGame()
      : {
          score:0,
          adapt:50
        };


  const score =
    clamp(
      Math.round(
        result.score || 0
      ),
      0,
      100
    );


  const adapt =
    clamp(
      Math.round(
        result.adapt ?? 50
      ),
      0,
      100
    );


  skillScores[
    currentGame.skill
  ].push(
    score
  );


  skillScores.ADAPT.push(
    adapt
  );


  played++;


  updateGamiq();


  const finish =
    currentCard
      .querySelector(
        ".finish"
      );


  finish
    .querySelector(
      ".finish-score-value"
    )
    .textContent =
      `+${score}`;


  finish.classList.add(
    "show"
  );


  swipeUnlockAt =
    performance.now()
    + 500;


  setTimeout(
    () => {

      canSwipe =
        true;

    },
    500
  );

}


/* ==========================================
GAMIQ
========================================== */

function updateGamiq(){

  const keys = [

    "REFLEX",
    "SPEED",
    "AIM",
    "LOGIC",
    "MEMORY"

  ];


  const values =
    keys
      .map(
        key =>
          avg(
            skillScores[key]
          )
      )
      .filter(
        value =>
          value !== null
      );


  const base =
    values.length
      ? avg(values)
      : 50;


  const adapt =
    avg(
      skillScores.ADAPT
    );


  const combined =
    adapt === null
      ? base
      : base*.85
        + adapt*.15;


  gamiq =
    Math.round(
      300
      + combined*7
    );


  const confidence =
    Math.min(
      99,
      Math.round(
        100
        *
        (
          1
          -
          Math.exp(
            -played/18
          )
        )
      )
    );


  $("playedTop").textContent =
    played;


  $("playedSide").textContent =
    played;


  $("gamiqTop").textContent =
    gamiq;


  $("gamiqSide").textContent =
    gamiq;


  $("confidenceTop").textContent =
    confidence+"%";


  $("confidenceSide").textContent =
    confidence+"%";


  $("confidenceFill").style.width =
    confidence+"%";


  const map = {

    REFLEX:"skillReflex",
    SPEED:"skillSpeed",
    AIM:"skillAim",
    LOGIC:"skillLogic",
    MEMORY:"skillMemory",
    ADAPT:"skillAdapt"

  };


  Object.entries(
    map
  ).forEach(
    ([key,id]) => {

      const value =
        avg(
          skillScores[key]
        );


      $(id).textContent =
        value === null
          ? "--"
          : Math.round(value);

    }
  );

}

ENGINE SELECT

){

  if(

    );

  }

      play
    );

  }


  if(
    game.type ===
    "aim"
  ){

    return aimEngine(

      play,
      false
    );

  }


  if(
    game.type ===
    "aimmove"
  ){

    return aimEngine(
      game,
      play,
      true
    );

  }


  if(
    game.type ===

/* ==========================================
REACTION
========================================== */

function reactionEngine(
  game,
  play
){

  let good =
    0;


  let falseStart =
    0;


  let total =
    0;


  let ready =
    false;


  let shown =
    0;


  let timer =
    null;


  let combo =
    0;


  const rounds =
    [];


  play.innerHTML = `

    <div class="center">

      <div class="world-object">
        ${game.icon}
      </div>

      <button
        class="round-button"
        id="rbtn"
      >
        WAIT
      </button>

      <span
        class="message"
        id="rmsg"
      >
        ${game.rule}
      </span>

    </div>

  `;


  const board =
    play.closest(
      ".board"
    );


  const btn =
    play.querySelector(
      "#rbtn"
    );


  const msg =
    play.querySelector(
      "#rmsg"
    );


  function next(){

    ready =
      false;


    btn.textContent =
      "WAIT";


    btn.style.filter =
      "brightness(.35)";


    clearTimeout(
      timer
    );


    timer =
      setTimeout(
        () => {

          if(!gameActive){

            return;

          }


          ready =
            true;


          shown =
            performance.now();


          btn.textContent =
            "GO";


          btn.style.filter =
            "brightness(1.2)";

        },
        400
        +
        Math.random()*850
      );

  }


  function press(){

    if(!gameActive){

      return;

    }


    if(!ready){

      falseStart++;


      combo =
        0;


      rounds.push(
        0
      );


      fail(
        board
      );


      next();


      return;

    }


    const reaction =
      performance.now()
      - shown;


    good++;


    total +=
      reaction;


    const score =
      clamp(
        100
        -
        (
          reaction-180
        )/5,
        0,
        100
      );


    rounds.push(
      score
    );


    combo =
      score > 55
        ? combo+1
        : 0;


    if(combo){

      success(
        board,
        combo
      );

    }


    msg.textContent =
      Math.round(
        reaction
      )
      +" ms";


    next();

  }


  btn.addEventListener(
    "pointerdown",
    press
  );


  cleanupFns.push(
    () => {

      clearTimeout(
        timer
      );


      btn.removeEventListener(
        "pointerdown",
        press
      );

    }
  );


  next();


  return () => ({

    score:
      clamp(
        100
        -
        (
          (
            good
              ? total/good
              : 1000
          )
          -180
        )/5
        -
        falseStart*8,
        0,
        100
      ),

    adapt:
      adaptScore(
        rounds
      )

  });

}


/* ==========================================
GO / NO GO
========================================== */

function goNoGoEngine(
  game,
  play
){

  let correct =
    0;


  let wrong =
    0;


  let miss =
    0;


  let state =
    null;


  let timer =
    null;


  let combo =
    0;


  const rounds =
    [];


  play.innerHTML = `

    <div class="center">

      <div class="world-object">
        ${game.icon}
      </div>

      <button
        class="color-box"
        id="box"
      ></button>

      <span class="message">
        ${game.rule}
      </span>

    </div>

  `;


  const board =
    play.closest(
      ".board"
    );


  const box =
    play.querySelector(
      "#box"
    );


  function next(){

    if(!gameActive){

      return;

    }


    state =
      null;


    box.className =
      "color-box";


    timer =
      setTimeout(
        () => {

          if(!gameActive){

            return;

          }


          state =
            Math.random() < .58
              ? "go"
              : "stop";


          box.classList.add(
            state
          );


          timer =
            setTimeout(
              () => {

                if(
                  state === "go"
                ){

                  miss++;


                  combo =
                    0;


                  rounds.push(
                    0
                  );

                }
                else{

                  rounds.push(
                    100
                  );

                }


                next();

              },
              state === "go"
                ? 620
                : 480
            );

        },
        200
        +
        Math.random()*320
      );

  }


  function press(){

    if(!gameActive){

      return;

    }


    clearTimeout(
      timer
    );


    if(
      state === "go"
    ){

      correct++;


      combo++;


      rounds.push(
        100
      );


      success(
        board,
        combo
      );

    }
    else{

      wrong++;


      combo =
        0;


      rounds.push(
        0
      );


      fail(
        board
      );

    }


    next();

  }


  box.addEventListener(
    "pointerdown",
    press
  );


  cleanupFns.push(
    () => {

      clearTimeout(
        timer
      );


      box.removeEventListener(
        "pointerdown",
        press
      );

    }
  );


  next();


  return () => {

    const total =
      correct
      +
      wrong
      +
      miss;


    return {

      score:
        total
          ? clamp(
              correct/total*100
              -
              wrong*5,
              0,
              100
            )
          : 0,

      adapt:
        adaptScore(
          rounds
        )

    };

  };

}


/* ==========================================
TAP
========================================== */

function tapEngine(
  game,
  play
){

  let count =
    0;


  let chunk =
    0;


  const chunks =
    [];


  const timer =
    setInterval(
      () => {

        chunks.push(
          clamp(
            chunk*14,
            0,
            100
          )
        );


        chunk =
          0;

      },
      1000
    );


  play.innerHTML = `

    <div class="center">

      <div
        class="world-object"
        id="world"
      >
        ${game.icon}
      </div>

      <div class="energy">

        <div
          class="energy-fill"
          id="fill"
        ></div>

      </div>

      <span
        class="counter"
        id="cnt"
      >
        0
      </span>

      <button
        class="round-button"
        id="tap"
      >
        TAP
      </button>

      <div class="world-label">
        ${game.rule}
      </div>

    </div>

  `;


  const board =
    play.closest(
      ".board"
    );


  const btn =
    play.querySelector(
      "#tap"
    );


  const cnt =
    play.querySelector(
      "#cnt"
    );


  const fill =
    play.querySelector(
      "#fill"
    );


  const world =
    play.querySelector(
      "#world"
    );


  function press(){

    if(!gameActive){

      return;

    }


    count++;


    chunk++;


    cnt.textContent =
      count;


    fill.style.width =
      Math.min(
        100,
        count/70*100
      )
      +"%";


    world.style.transform =
      `scale(${
        1
        +
        Math.min(
          .35,
          count/200
        )
      })`;


    if(
      [18,35,55]
        .includes(
          count
        )
    ){

      success(
        board,
        Math.floor(
          count/18
        )+2
      );

    }

  }


  btn.addEventListener(
    "pointerdown",
    press
  );


  cleanupFns.push(
    () => {

      clearInterval(
        timer
      );


      btn.removeEventListener(
        "pointerdown",
        press
      );

    }
  );


  return () => {

    clearInterval(
      timer
    );


    chunks.push(
      clamp(
        chunk*14,
        0,
        100
      )
    );


    return {

      score:
        clamp(
          count/1.05,
          0,
          100
        ),

      adapt:
        adaptScore(
          chunks
        )

    };

  };

}


/* ==========================================
ALTERNATE
========================================== */

function alternateEngine(
  game,
  play
){

  let correct =
    0;


  let wrong =
    0;


  let expected =
    "L";


  let combo =
    0;


  const rounds =
    [];


  play.innerHTML = `

    <div class="center">

      <div class="world-object">
        ${game.icon}
      </div>

      <div class="alt-grid">

        <button
          class="alt-btn active"
          data-side="L"
        >
          LEFT
        </button>

        <button
          class="alt-btn"
          data-side="R"
        >
          RIGHT
        </button>

      </div>

      <div class="world-label">
        ${game.rule}
      </div>

    </div>

  `;


  const board =
    play.closest(
      ".board"
    );


  const buttons =
    [
      ...play.querySelectorAll(
        ".alt-btn"
      )
    ];


  function render(){

    buttons.forEach(
      btn => {

        btn.classList.toggle(
          "active",
          btn.dataset.side
          === expected
        );

      }
    );

  }


  function press(
    event
  ){

    if(!gameActive){

      return;

    }


    const side =
      event
        .currentTarget
        .dataset
        .side;


    if(
      side === expected
    ){

      correct++;


      combo++;


      rounds.push(
        100
      );


      expected =
        expected === "L"
          ? "R"
          : "L";


      if(
        combo % 5 === 0
      ){

        success(
          board,
          combo
        );

      }

    }
    else{

      wrong++;


      combo =
        0;


      rounds.push(
        0
      );


      fail(
        board
      );

    }


    render();

  }


  buttons.forEach(
    btn =>
      btn.addEventListener(
        "pointerdown",
        press
      )
  );


  cleanupFns.push(
    () => {

      buttons.forEach(
        btn =>
          btn.removeEventListener(
            "pointerdown",
            press
          )
      );

    }
  );


  return () => ({

    score:
      clamp(
        correct*2
        -
        wrong*3,
        0,
        100
      ),

    adapt:
      adaptScore(
        rounds
      )

  });

}


/* ==========================================
AIM
========================================== */

function aimEngine(
  game,
  play,
  moving
){

  let tx =
    0;


  let ty =
    0;


  let cx =
    0;


  let cy =
    0;


  let targetSize =
    moving
      ? 56
      : 64;


  let shots =
    0;


  let hits =
    0;


  let totalReaction =
    0;


  let shown =
    0;


  let vx =
    2;


  let vy =
    1.4;


  let moveRAF =
    null;


  let joystickRAF =
    null;


  let joyX =
    0;


  let joyY =
    0;


  let combo =
    0;


  const rounds =
    [];


  play.innerHTML = `

    <div
      class="aim"
      id="aim"
    >

      <div
        class="world-object"
        style="
          position:absolute;
          left:16px;
          top:10px;
          font-size:42px;
        "
      >
        ${game.icon}
      </div>


      <div
        class="target"
        id="target"
      ></div>


      <div
        class="crosshair"
        id="cross"
      >
        <div class="crosshair-center"></div>
      </div>


      <div class="mobile-controls">

        <div
          class="joystick"
          id="joy"
        >
          <div
            class="joystick-knob"
            id="knob"
          ></div>
        </div>

        <button
          class="fire"
          id="fire"
        >
          FIRE
        </button>

      </div>

    </div>

  `;


  const board =
    play.closest(
      ".board"
    );


  const area =
    play.querySelector(
      "#aim"
    );


  const target =
    play.querySelector(
      "#target"
    );


  const cross =
    play.querySelector(
      "#cross"
    );


  const joy =
    play.querySelector(
      "#joy"
    );


  const knob =
    play.querySelector(
      "#knob"
    );


  const fireBtn =
    play.querySelector(
      "#fire"
    );


  const dimensions =
    () => {

      const rect =
        area
          .getBoundingClientRect();


      return {
        w:rect.width,
        h:rect.height
      };

    };


  function renderCross(){

    cross.style.left =
      cx+"px";


    cross.style.top =
      cy+"px";

  }


  function spawn(){

    if(!gameActive){

      return;

    }


    const size =
      dimensions();


    tx =
      45
      +
      Math.random()
      *
      Math.max(
        20,
        size.w-90
      );


    ty =
      50
      +
      Math.random()
      *
      Math.max(
        20,
        size.h-130
      );


    target.style.left =
      tx+"px";


    target.style.top =
      ty+"px";


    shown =
      performance.now();


    vx =
      (
        Math.random() < .5
          ? -1
          : 1
      )
      *
      (
        1.5
        +
        Math.random()*1.3
      );


    vy =
      (
        Math.random() < .5
          ? -1
          : 1
      )
      *
      (
        1
        +
        Math.random()
      );

  }


  function laser(
    x,
    y,
    hit
  ){

    const size =
      dimensions();


    const startX =
      size.w/2;


    const startY =
      size.h-8;


    const dx =
      x-startX;


    const dy =
      y-startY;


    const length =
      Math.hypot(
        dx,
        dy
      );


    const angle =
      Math.atan2(
        dy,
        dx
      )
      *180/Math.PI;


    const beam =
      document.createElement(
        "div"
      );


    beam.className =
      "laser";


    beam.style.left =
      startX+"px";


    beam.style.top =
      startY+"px";


    beam.style.width =
      length+"px";


    beam.style.transform =
      `rotate(${angle}deg)`;


    area.appendChild(
      beam
    );


    const impact =
      document.createElement(
        "div"
      );


    impact.className =
      hit
        ? "impact"
        : "impact miss";


    impact.style.left =
      x+"px";


    impact.style.top =
      y+"px";


    area.appendChild(
      impact
    );


    setTimeout(
      () => {

        beam.remove();

        impact.remove();

      },
      280
    );

  }


  function fire(){

    if(!gameActive){

      return;

    }


    shots++;


    const hit =
      Math.hypot(
        cx-tx,
        cy-ty
      )
      <= targetSize/2;


    laser(
      cx,
      cy,
      hit
    );


    if(hit){

      hits++;


      combo++;


      const reaction =
        performance.now()
        - shown;


      totalReaction +=
        reaction;


      rounds.push(
        clamp(
          100
          -
          (
            reaction-350
          )/22,
          0,
          100
        )
      );


      success(
        board,
        combo
      );


      spawn();

    }
    else{

      combo =
        0;


      rounds.push(
        0
      );


      fail(
        board
      );

    }

  }


  function mouseMove(
    event
  ){

    if(
      innerWidth <= 900
    ){

      return;

    }


    const rect =
      area
        .getBoundingClientRect();


    cx =
      event.clientX
      - rect.left;


    cy =
      event.clientY
      - rect.top;


    renderCross();

  }


  function desktopFire(
    event
  ){

    if(
      innerWidth <= 900
    ){

      return;

    }


    event.preventDefault();


    fire();

  }


  function joystickMove(
    event
  ){

    if(
      innerWidth > 900
    ){

      return;

    }


    event.preventDefault();


    const touch =
      event.touches
        ? event.touches[0]
        : event;


    const rect =
      joy
        .getBoundingClientRect();


    const originX =
      rect.left
      +
      rect.width/2;


    const originY =
      rect.top
      +
      rect.height/2;


    let dx =
      touch.clientX
      - originX;


    let dy =
      touch.clientY
      - originY;


    const max =
      32;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    if(
      distance > max
    ){

      dx =
        dx/distance*max;


      dy =
        dy/distance*max;

    }


    joyX =
      dx/max;


    joyY =
      dy/max;


    knob.style.transform =
      `translate(${dx}px,${dy}px)`;

  }


  function joystickEnd(){

    joyX =
      0;


    joyY =
      0;


    knob.style.transform =
      "translate(0,0)";

  }


  function joystickLoop(){

    if(gameActive){

      const size =
        dimensions();


      cx =
        clamp(
          cx
          +
          joyX*5.5,
          0,
          size.w
        );


      cy =
        clamp(
          cy
          +
          joyY*5.5,
          0,
          size.h
        );


      renderCross();

    }


    joystickRAF =
      requestAnimationFrame(
        joystickLoop
      );

  }


  function moveTarget(){

    if(
      gameActive &&
      moving
    ){

      const size =
        dimensions();


      const radius =
        targetSize/2;


      tx +=
        vx;


      ty +=
        vy;


      if(
        tx < radius ||
        tx > size.w-radius
      ){

        vx *=
          -1;

      }


      if(
        ty < radius ||
        ty > size.h-radius-90
      ){

        vy *=
          -1;

      }


      tx =
        clamp(
          tx,
          radius,
          size.w-radius
        );


      ty =
        clamp(
          ty,
          radius,
          size.h-radius-90
        );


      target.style.left =
        tx+"px";


      target.style.top =
        ty+"px";

    }


    moveRAF =
      requestAnimationFrame(
        moveTarget
      );

  }


  const size =
    dimensions();


  cx =
    size.w/2;


  cy =
    size.h/2;


  renderCross();


  spawn();


  area.addEventListener(
    "mousemove",
    mouseMove
  );


  area.addEventListener(
    "pointerdown",
    desktopFire
  );


  joy.addEventListener(
    "touchstart",
    joystickMove,
    {
      passive:false
    }
  );


  joy.addEventListener(
    "touchmove",
    joystickMove,
    {
      passive:false
    }
  );


  joy.addEventListener(
    "touchend",
    joystickEnd
  );


  fireBtn.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

      fire();

    }
  );


  joystickLoop();


  moveTarget();


  cleanupFns.push(
    () => {

      area.removeEventListener(
        "mousemove",
        mouseMove
      );


      area.removeEventListener(
        "pointerdown",
        desktopFire
      );


      cancelAnimationFrame(
        moveRAF
      );


      cancelAnimationFrame(
        joystickRAF
      );

    }
  );


  return () => {

    const accuracy =
      shots
        ? hits/shots
        : 0;


    const reaction =
      hits
        ? totalReaction/hits
        : 2000;


    return {

      score:
        clamp(
          accuracy*70
          +
          Math.max(
            0,
            30
            -
            (
              reaction-400
            )/45
          ),
          0,
          100
        ),

      adapt:
        adaptScore(
          rounds
        )

    };

  };

}


/* ==========================================
HIGH LOW
========================================== */

function highLowEngine(
  game,
  play
){

  let correct =
    0;


  let attempts =
    0;


  let combo =
    0;


  const rounds =
    [];


  function next(){

    if(!gameActive){

      return;

    }


    let a =
      Math.floor(
        Math.random()*90
      )+10;


    let b =
      Math.floor(
        Math.random()*90
      )+10;


    while(
      a === b
    ){

      b =
        Math.floor(
          Math.random()*90
        )+10;

    }


    const answer =
      Math.max(
        a,
        b
      );


    play.innerHTML = `

      <div class="center">

        <div class="world-object">
          ${game.icon}
        </div>

        <div class="logic-label">
          ${game.rule}
        </div>

        <div class="choice-wrap">

          <button
            class="choice"
            data-value="${a}"
          >
            ${a}
          </button>

          <button
            class="choice"
            data-value="${b}"
          >
            ${b}
          </button>

        </div>

      </div>

    `;


    const board =
      play.closest(
        ".board"
      );


    play
      .querySelectorAll(
        ".choice"
      )
      .forEach(
        btn => {

          btn.addEventListener(
            "pointerdown",
            () => {

              if(!gameActive){

                return;

              }


              attempts++;


              const good =
                Number(
                  btn.dataset.value
                )
                === answer;


              if(good){

                correct++;


                combo++;


                rounds.push(
                  100
                );


                success(
                  board,
                  combo
                );

              }
              else{

                combo =
                  0;


                rounds.push(
                  0
                );


                fail(
                  board
                );

              }


              setTimeout(
                next,
                120
              );

            },
            {
              once:true
            }
          );

        }
      );

  }


  next();


  return () => ({

    score:
      attempts
        ? clamp(
            correct/attempts*70
            +
            attempts*2.2,
            0,
            100
          )
        : 0,

    adapt:
      adaptScore(
        rounds
      )

  });

}


/* ==========================================
CONDITION
========================================== */

function conditionEngine(
  game,
  play
){

  let correct =
    0;


  let attempts =
    0;


  let combo =
    0;


  const rounds =
    [];


  const rules = [

    [
      "大きい方",
      (a,b) =>
        Math.max(
          a,
          b
        )
    ],

    [
      "小さい方",
      (a,b) =>
        Math.min(
          a,
          b
        )
    ],

    [
      "偶数",
      (a,b) =>
        a%2 === 0
          ? a
          : b
    ]

  ];


  function next(){

    if(!gameActive){

      return;

    }


    const [
      label,
      ruleFunction
    ] =
      rules[
        Math.floor(
          Math.random()
          * rules.length
        )
      ];


    let a;

    let b;


    if(
      label === "偶数"
    ){

      a =
        Math.floor(
          Math.random()*40
        )*2+2;


      b =
        Math.floor(
          Math.random()*40
        )*2+1;


      if(
        Math.random() < .5
      ){

        [
          a,
          b
        ] =
        [
          b,
          a
        ];

      }

    }
    else{

      a =
        Math.floor(
          Math.random()*90
        )+10;


      b =
        Math.floor(
          Math.random()*90
        )+10;


      while(
        a === b
      ){

        b++;

      }

    }


    const answer =
      ruleFunction(
        a,
        b
      );


    play.innerHTML = `

      <div class="center">

        <div class="world-object">
          ${game.icon}
        </div>

        <div class="logic-label">
          ${label}
        </div>

        <div class="choice-wrap">

          <button
            class="choice"
            data-value="${a}"
          >
            ${a}
          </button>

          <button
            class="choice"
            data-value="${b}"
          >
            ${b}
          </button>

        </div>

      </div>

    `;


    const board =
      play.closest(
        ".board"
      );


    play
      .querySelectorAll(
        ".choice"
      )
      .forEach(
        btn => {

          btn.addEventListener(
            "pointerdown",
            () => {

              attempts++;


              const good =
                Number(
                  btn.dataset.value
                )
                === answer;


              if(good){

                correct++;


                combo++;


                rounds.push(
                  100
                );


                success(
                  board,
                  combo
                );

              }
              else{

                combo =
                  0;


                rounds.push(
                  0
                );


                fail(
                  board
                );

              }


              setTimeout(
                next,
                120
              );

            },
            {
              once:true
            }
          );

        }
      );

  }


  next();


  return () => ({

    score:
      attempts
        ? clamp(
            correct/attempts*70
            +
            attempts*2,
            0,
            100
          )
        : 0,

    adapt:
      adaptScore(
        rounds
      )

  });

}


/* ==========================================
SEQUENCE
========================================== */

function sequenceEngine(
  game,
  play
){

  let rounds =
    0;


  let successes =
    0;


  let sequence =
    [];


  let index =
    0;


  let accepting =
    false;


  let timers =
    [];


  let combo =
    0;


  const scores =
    [];


  play.innerHTML = `

    <div class="center">

      <div
        class="world-object"
        style="font-size:56px"
      >
        ${game.icon}
      </div>

      <div class="memory-grid">

        ${Array.from(
          {
            length:9
          },
          (_,i) => `
            <button
              class="memory-cell"
              data-index="${i}"
            ></button>
          `
        ).join("")}

      </div>

      <span
        class="message"
        id="memoryMessage"
      >
        覚えろ
      </span>

    </div>

  `;


  const board =
    play.closest(
      ".board"
    );


  const cells =
    [
      ...play.querySelectorAll(
        ".memory-cell"
      )
    ];


  const message =
    play.querySelector(
      "#memoryMessage"
    );


  function clearTimers(){

    timers.forEach(
      clearTimeout
    );


    timers =
      [];

  }


  function round(){

    clearTimers();


    accepting =
      false;


    index =
      0;


    const length =
      Math.min(
        5,
        3
        +
        Math.floor(
          rounds/2
        )
      );


    sequence =
      Array.from(
        {
          length
        },
        () =>
          Math.floor(
            Math.random()*9
          )
      );


    message.textContent =
      "覚えろ";


    let delay =
      160;


    sequence.forEach(
      cellIndex => {

        timers.push(
          setTimeout(
            () =>
              cells[
                cellIndex
              ]
              .classList
              .add(
                "demo"
              ),
            delay
          )
        );


        timers.push(
          setTimeout(
            () =>
              cells[
                cellIndex
              ]
              .classList
              .remove(
                "demo"
              ),
            delay+180
          )
        );


        delay +=
          270;

      }
    );


    timers.push(
      setTimeout(
        () => {

          accepting =
            true;


          message.textContent =
            "再現";

        },
        delay+40
      )
    );

  }


  const handlers =
    cells.map(
      cell => {

        const handler =
          () => {

            if(
              !gameActive ||
              !accepting
            ){

              return;

            }


            const good =
              Number(
                cell.dataset.index
              )
              ===
              sequence[index];


            cell.classList.add(
              good
                ? "correct"
                : "wrong"
            );


            setTimeout(
              () =>
                cell.classList.remove(
                  "correct",
                  "wrong"
                ),
              130
            );


            if(good){

              index++;


              if(
                index
                ===
                sequence.length
              ){

                successes++;


                rounds++;


                combo++;


                scores.push(
                  100
                );


                accepting =
                  false;


                success(
                  board,
                  combo
                );


                timers.push(
                  setTimeout(
                    round,
                    280
                  )
                );

              }

            }
            else{

              rounds++;


              combo =
                0;


              scores.push(
                0
              );


              accepting =
                false;


              fail(
                board
              );


              timers.push(
                setTimeout(
                  round,
                  330
                )
              );

            }

          };


        cell.addEventListener(
          "pointerdown",
          handler
        );


        return [
          cell,
          handler
        ];

      }
    );


  cleanupFns.push(
    () => {

      clearTimers();


      handlers.forEach(
        ([cell,handler]) =>
          cell.removeEventListener(
            "pointerdown",
            handler
          )
      );

    }
  );


  round();


  return () => ({

    score:
      rounds
        ? clamp(
            successes/rounds*85
            +
            successes*5,
            0,
            100
          )
        : 0,

    adapt:
      adaptScore(
        scores
      )

  });

}


/* ==========================================
POSITION
========================================== */

function positionEngine(
  game,
  play
){

  let rounds =
    0;


  let successes =
    0;


  let targets =
    new Set();


  let selected =
    new Set();


  let accepting =
    false;


  let timer =
    null;


  let combo =
    0;


  const scores =
    [];


  play.innerHTML = `

    <div class="center">

      <div
        class="world-object"
        style="font-size:56px"
      >
        ${game.icon}
      </div>

      <div class="position-grid">

        ${Array.from(
          {
            length:16
          },
          (_,i) => `
            <button
              class="position-cell"
              data-index="${i}"
            ></button>
          `
        ).join("")}

      </div>

      <span
        class="message"
        id="positionMessage"
      >
        覚えろ
      </span>

    </div>

  `;


  const board =
    play.closest(
      ".board"
    );


  const cells =
    [
      ...play.querySelectorAll(
        ".position-cell"
      )
    ];


  const message =
    play.querySelector(
      "#positionMessage"
    );


  function round(){

    selected =
      new Set();


    targets =
      new Set();


    accepting =
      false;


    cells.forEach(
      cell => {

        cell.className =
          "position-cell";

      }
    );


    while(
      targets.size < 4
    ){

      targets.add(
        Math.floor(
          Math.random()*16
        )
      );

    }


    targets.forEach(
      index => {

        cells[
          index
        ]
        .classList
        .add(
          "preview"
        );

      }
    );


    message.textContent =
      "覚えろ";


    timer =
      setTimeout(
        () => {

          cells.forEach(
            cell =>
              cell.classList.remove(
                "preview"
              )
          );


          accepting =
            true;


          message.textContent =
            "再現";

        },
        620
      );

  }


  const handlers =
    cells.map(
      cell => {

        const handler =
          () => {

            if(
              !gameActive ||
              !accepting
            ){

              return;

            }


            const index =
              Number(
                cell.dataset.index
              );


            if(
              selected.has(
                index
              )
            ){

              return;

            }


            selected.add(
              index
            );


            const good =
              targets.has(
                index
              );


            cell.classList.add(
              good
                ? "correct"
                : "wrong"
            );


            if(!good){

              fail(
                board
              );

            }


            if(
              selected.size
              === 4
            ){

              rounds++;


              let count =
                0;


              selected.forEach(
                value => {

                  if(
                    targets.has(
                      value
                    )
                  ){

                    count++;

                  }

                }
              );


              scores.push(
                count/4*100
              );


              if(
                count === 4
              ){

                successes++;


                combo++;


                success(
                  board,
                  combo
                );

              }
              else{

                combo =
                  0;

              }


              accepting =
                false;


              message.textContent =
                count === 4
                  ? "CLEAR"
                  : `${count}/4`;


              timer =
                setTimeout(
                  round,
                  330
                );

            }

          };


        cell.addEventListener(
          "pointerdown",
          handler
        );


        return [
          cell,
          handler
        ];

      }
    );


  cleanupFns.push(
    () => {

      clearTimeout(
        timer
      );


      handlers.forEach(
        ([cell,handler]) =>
          cell.removeEventListener(
            "pointerdown",
            handler
          )
      );

    }
  );


  round();


  return () => ({

    score:
      rounds
        ? clamp(
            successes/rounds*90
            +
            successes*4,
            0,
            100
          )
        : 0,

    adapt:
      adaptScore(
        scores
      )

  });

}


/* ==========================================
SWIPE
========================================== */

let startY =
  null;


let lastY =
  null;


let dragging =
  false;


feed.addEventListener(
  "touchstart",
  event => {

    if(
      !canSwipe ||
      performance.now()
      <
      swipeUnlockAt
    ){

      return;

    }


    startY =
      event.touches[0].clientY;


    lastY =
      startY;


    dragging =
      true;


    currentCard.classList.remove(
      "animating"
    );


    nextCard.classList.remove(
      "animating"
    );

  },
  {
    passive:false
  }
);


feed.addEventListener(
  "touchmove",
  event => {

    if(!dragging){

      return;

    }


    event.preventDefault();


    lastY =
      event.touches[0].clientY;


    let delta =
      Math.min(
        0,
        lastY-startY
      );


    currentCard.style.transform =
      `translateY(${delta}px)`;


    nextCard.style.transform =
      `translateY(calc(100% + ${delta}px))`;

  },
  {
    passive:false
  }
);


feed.addEventListener(
  "touchend",
  () => {

    if(!dragging){

      return;

    }


    dragging =
      false;


    if(
      lastY-startY < -75
    ){

      commitSwipe();

    }
    else{

      cancelSwipe();

    }

  },
  {
    passive:false
  }
);


function cancelSwipe(){

  currentCard.classList.add(
    "animating"
  );


  nextCard.classList.add(
    "animating"
  );


  currentCard.style.transform =
    "translateY(0)";


  nextCard.style.transform =
    "translateY(100%)";

}


function commitSwipe(){

  if(!canSwipe){

    return;

  }


  canSwipe =
    false;


  currentCard.classList.add(
    "animating"
  );


  nextCard.classList.add(
    "animating"
  );


  currentCard.style.transform =
    "translateY(-100%)";


  nextCard.style.transform =
    "translateY(0)";


  setTimeout(
    completeSwipe,
    350
  );

}


function completeSwipe(){

  cleanupGame();


  const oldCard =
    currentCard;


  currentCard =
    nextCard;


  nextCard =
    oldCard;


  currentCard.className =
    "card current";


  currentCard.style.transform =
    "translateY(0)";


  nextCard.className =
    "card next";


  nextCard.style.transform =
    "translateY(100%)";


  currentGame =
    nextGame;


  nextGame =
    getNextGame();


  renderCard(
    nextCard,
    nextGame,
    true
  );


  beginCurrentGame();

}


/* ==========================================
DESKTOP NEXT
========================================== */

let wheelLock =
  false;


window.addEventListener(
  "wheel",
  event => {

    if(
      !canSwipe ||
      wheelLock ||
      event.deltaY < 45
    ){

      return;

    }


    wheelLock =
      true;


    commitSwipe();


    setTimeout(
      () => {

        wheelLock =
          false;

      },
      700
    );

  },
  {
    passive:true
  }
);


window.addEventListener(
  "keydown",
  event => {

    if(
      canSwipe &&
      event.key ===
      "ArrowDown"
    ){

      commitSwipe();

    }

  }
);


/* ==========================================
START BUTTON
========================================== */

$("startBtn")
  .addEventListener(
    "click",
    start
  );


})();
