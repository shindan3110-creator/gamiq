<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GAMIQ - TRUE GAMING SKILL</title>

<style>
:root{
  --bg:#05070c;
  --panel:#0a0e16;
  --text:#f8fbff;
  --muted:#818ca1;
  --cyan:#61eaff;
  --violet:#8466ff;
  --green:#76ffb2;
  --red:#ff4e70;
  --yellow:#ffe46b;
  --orange:#ff9b54;
  --line:rgba(255,255,255,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
  background:#05070c;
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
}

body{
  position:fixed;
  inset:0;
}

button{
  font:inherit;
}

.app{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
  gap:16px;
  padding:16px;
  background:
    radial-gradient(circle at 10% 0%,rgba(132,102,255,.16),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(97,234,255,.10),transparent 25%),
    #05070c;
}

.main{
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.header{
  height:54px;
  flex:0 0 54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:24px;
  font-weight:1000;
  letter-spacing:.15em;
}

.brand span{
  color:var(--cyan);
}

.live{
  display:flex;
  gap:24px;
  align-items:center;
}

.live-block{
  text-align:right;
}

.live-label{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  letter-spacing:.16em;
}

.live-value{
  display:block;
  font-size:20px;
  font-weight:1000;
  transition:transform .2s ease,color .2s ease;
}

.live-value.flash-up{
  animation:scoreUp .6s ease;
}

.live-value.flash-down{
  animation:scoreDown .6s ease;
}

@keyframes scoreUp{
  0%{transform:scale(1)}
  45%{
    color:var(--green);
    transform:scale(1.22);
    text-shadow:0 0 20px rgba(118,255,178,.7);
  }
  100%{transform:scale(1)}
}

@keyframes scoreDown{
  0%{transform:scale(1)}
  45%{
    color:var(--red);
    transform:scale(1.15);
  }
  100%{transform:scale(1)}
}

.feed{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:30px;
  background:#080c13;
  box-shadow:
    0 28px 70px rgba(0,0,0,.46),
    inset 0 1px 0 rgba(255,255,255,.04);
  touch-action:none;
}

.feed.shake{
  animation:screenShake .15s linear;
}

@keyframes screenShake{
  0%{transform:translate(0,0)}
  25%{transform:translate(-2px,1px)}
  50%{transform:translate(2px,-1px)}
  75%{transform:translate(-1px,-1px)}
  100%{transform:translate(0,0)}
}

.feed.miss-flash::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:200;
  pointer-events:none;
  background:rgba(255,78,112,.18);
  animation:missFlash .18s ease-out forwards;
}

@keyframes missFlash{
  from{opacity:1}
  to{opacity:0}
}

.card{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 30%,rgba(97,234,255,.05),transparent 42%),
    radial-gradient(circle at 75% 80%,rgba(132,102,255,.06),transparent 42%),
    linear-gradient(180deg,#0b1019,#070a10);
  will-change:transform,opacity,filter;
}

.card.current{
  transform:translateY(0) scale(1);
}

.card.next{
  transform:translateY(100%) scale(.98);
}

.card.animating{
  transition:
    transform .34s cubic-bezier(.22,.75,.28,1),
    opacity .34s ease,
    filter .34s ease;
}

.card-content{
  width:100%;
  height:100%;
  padding:30px;
  display:flex;
  flex-direction:column;
}

.game-head{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:14px;
}

.game-number{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:.16em;
}

.game-title{
  margin:4px 0 0;
  font-size:clamp(28px,4vw,48px);
  letter-spacing:-.04em;
}

.skill-badge{
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:999px;
  color:#aeb9cb;
  font-size:10px;
  font-weight:900;
  letter-spacing:.12em;
}

.board{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 40%,rgba(97,234,255,.04),transparent 45%),
    #070a11;
}

.play{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  padding:22px;
}

.rule{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:rgba(5,8,14,.78);
  backdrop-filter:blur(14px);
}

.rule-inner{
  width:min(720px,100%);
  text-align:center;
}

.rule-label{
  color:var(--cyan);
  font-size:10px;
  font-weight:1000;
  letter-spacing:.22em;
}

.rule-text{
  margin-top:13px;
  font-size:clamp(27px,4vw,50px);
  line-height:1.3;
  font-weight:1000;
  letter-spacing:-.03em;
}

.rule-bar{
  width:105px;
  height:3px;
  margin:24px auto 0;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
}

.rule-bar-fill{
  width:0;
  height:100%;
  background:linear-gradient(90deg,var(--violet),var(--cyan));
}

.rule-bar-fill.go{
  animation:ruleReady .9s linear forwards;
}

@keyframes ruleReady{
  to{width:100%}
}

.finish{
  position:absolute;
  inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(5,8,14,.78);
  backdrop-filter:blur(9px);
}

.finish.show{
  display:flex;
}

.finish-score{
  font-size:clamp(66px,10vw,120px);
  font-weight:1000;
  line-height:1;
  animation:finishPop .28s ease-out;
}

@keyframes finishPop{
  from{
    opacity:0;
    transform:scale(.55);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.finish-skill{
  margin-top:10px;
  color:#9da8bb;
  font-size:13px;
  font-weight:900;
}

.swipe-hint{
  margin-top:25px;
  color:#a9b5c8;
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
}

.swipe-arrow{
  display:block;
  font-size:32px;
  margin-bottom:4px;
  animation:arrow .9s ease-in-out infinite;
}

@keyframes arrow{
  50%{transform:translateY(-7px)}
}


/* FEEDBACK */

.feedback{
  position:absolute;
  z-index:120;
  left:50%;
  top:30%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  font-size:clamp(28px,6vw,64px);
  font-weight:1000;
  letter-spacing:-.04em;
  text-shadow:0 5px 20px rgba(0,0,0,.45);
  animation:feedbackPop .5s ease-out forwards;
}

.feedback.good{
  color:var(--cyan);
}

.feedback.great{
  color:var(--green);
}

.feedback.perfect{
  color:var(--yellow);
}

.feedback.miss{
  color:var(--red);
}

@keyframes feedbackPop{
  0%{
    opacity:0;
    transform:translate(-50%,-30%) scale(.6);
  }
  35%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.18);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-85%) scale(.92);
  }
}

.combo{
  position:absolute;
  z-index:115;
  top:18px;
  right:18px;
  padding:9px 13px;
  border-radius:999px;
  background:rgba(8,13,21,.78);
  border:1px solid rgba(255,255,255,.10);
  color:#fff;
  font-size:15px;
  font-weight:1000;
  backdrop-filter:blur(7px);
  animation:comboPop .2s ease-out;
}

.combo strong{
  color:var(--yellow);
}

@keyframes comboPop{
  from{transform:scale(.7)}
  to{transform:scale(1)}
}


/* SIDE */

.side{
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.panel{
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),
    #0a0e16;
}

.panel-title{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:.15em;
  margin-bottom:10px;
}

.gamiq-big{
  font-size:52px;
  line-height:1;
  font-weight:1000;
}

.confidence{
  margin-top:14px;
}

.conf-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#aeb8c9;
  font-size:11px;
  font-weight:900;
}

.conf-track{
  width:100%;
  height:6px;
  margin-top:8px;
  background:rgba(255,255,255,.07);
  border-radius:999px;
  overflow:hidden;
}

.conf-fill{
  height:100%;
  width:0;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--violet),var(--cyan));
  transition:width .45s ease;
}

.skill-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.045);
}

.skill-row:last-child{
  border-bottom:0;
}

.skill-row span{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:.1em;
}

.skill-row b{
  font-size:17px;
}

.play-count{
  font-size:34px;
  font-weight:1000;
}

.ad{
  flex:1;
  min-height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#586375;
  text-align:center;
  border-style:dashed;
}


/* COMMON */

.round-button{
  width:min(30vw,240px);
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  cursor:pointer;
  color:#031218;
  font-size:32px;
  font-weight:1000;
  touch-action:none;
  background:
    radial-gradient(circle at 35% 28%,
    #fff 0 7%,
    #a8f7ff 8%,
    #49d9ee 32%,
    #154958 70%,
    #081319 100%);
  box-shadow:
    0 0 45px rgba(97,234,255,.2),
    inset 0 0 35px rgba(255,255,255,.15);
  transition:transform .06s ease,filter .08s ease;
}

.round-button:active{
  transform:scale(.94);
}

.center-game{
  text-align:center;
}

.counter{
  display:block;
  margin-bottom:15px;
  font-size:48px;
  font-weight:1000;
}

.message{
  display:block;
  min-height:20px;
  margin-top:15px;
  color:var(--muted);
  font-size:13px;
  font-weight:900;
}


/* GREEN */

.color-box{
  width:min(42vw,310px);
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.1);
  border-radius:34px;
  background:#141b26;
  cursor:pointer;
  touch-action:none;
  transition:transform .08s ease,filter .08s ease;
}

.color-box:active{
  transform:scale(.96);
}

.color-box.green{
  background:#77ffb1;
  box-shadow:0 0 55px rgba(119,255,177,.45);
}

.color-box.red{
  background:#ff4e70;
  box-shadow:0 0 55px rgba(255,78,112,.35);
}


/* TAP / BOOST */

.tap-energy{
  width:min(360px,80vw);
  height:10px;
  margin:0 auto 18px;
  background:rgba(255,255,255,.07);
  border-radius:999px;
  overflow:hidden;
}

.tap-energy-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--violet),var(--cyan),var(--green));
  box-shadow:0 0 15px rgba(97,234,255,.4);
  transition:width .08s linear;
}

.boost-label{
  height:24px;
  margin-bottom:8px;
  color:var(--yellow);
  font-size:14px;
  font-weight:1000;
  letter-spacing:.1em;
}


/* ALTERNATE */

.alt-grid{
  width:min(700px,100%);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.alt-btn{
  min-height:230px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:25px;
  background:linear-gradient(180deg,#141c29,#090d14);
  color:#fff;
  font-size:30px;
  font-weight:1000;
  touch-action:none;
  transition:transform .06s ease,box-shadow .1s ease;
}

.alt-btn:active{
  transform:scale(.97);
}

.alt-btn.active{
  border-color:rgba(97,234,255,.45);
  box-shadow:0 0 25px rgba(97,234,255,.15);
}


/* LOGIC */

.choice-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:24px;
}

.choice{
  width:min(27vw,220px);
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.09);
  border-radius:25px;
  background:linear-gradient(180deg,#151d2b,#090d15);
  color:#fff;
  font-size:clamp(46px,7vw,82px);
  font-weight:1000;
  touch-action:none;
  transition:transform .08s ease,filter .08s ease;
}

.choice:active{
  transform:scale(.95);
}

.choice.correct-pop{
  animation:correctNumber .34s ease-out;
}

@keyframes correctNumber{
  0%{transform:scale(1)}
  45%{
    transform:scale(1.28) translateY(-8px);
    filter:brightness(1.8);
  }
  100%{
    transform:scale(.6) translateY(-45px);
    opacity:0;
  }
}

.logic-label{
  margin-bottom:18px;
  color:#a9b4c7;
  font-size:17px;
  font-weight:900;
}


/* MEMORY */

.memory-grid{
  display:grid;
  grid-template-columns:repeat(3,min(17vw,112px));
  gap:10px;
}

.memory-cell{
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  background:#141b27;
  touch-action:none;
  transition:transform .08s ease,background .08s ease;
}

.memory-cell.demo,
.memory-cell.correct{
  background:#75efff;
  box-shadow:0 0 25px rgba(97,234,255,.55);
  transform:scale(.92);
}

.memory-cell.wrong{
  background:var(--red);
  box-shadow:0 0 25px rgba(255,78,112,.55);
  transform:scale(.92);
}

.position-grid{
  display:grid;
  grid-template-columns:repeat(4,min(13vw,82px));
  gap:9px;
}

.position-cell{
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.07);
  border-radius:13px;
  background:#131a25;
  touch-action:none;
}

.position-cell.preview{
  background:var(--cyan);
  box-shadow:0 0 22px rgba(97,234,255,.45);
}

.position-cell.correct{
  background:var(--green);
}

.position-cell.wrong{
  background:var(--red);
}


/* AIM */

.aim{
  position:absolute;
  inset:0;
  overflow:hidden;
  cursor:none;
  touch-action:none;
}

.crosshair{
  position:absolute;
  z-index:20;
  width:44px;
  height:44px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.crosshair:before,
.crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 7px var(--cyan);
}

.crosshair:before{
  width:44px;
  height:2px;
  left:0;
  top:21px;
}

.crosshair:after{
  width:2px;
  height:44px;
  left:21px;
  top:0;
}

.crosshair-center{
  position:absolute;
  width:13px;
  height:13px;
  left:15.5px;
  top:15.5px;
  border:2px solid var(--cyan);
  border-radius:50%;
  box-shadow:0 0 9px var(--cyan);
}

.target{
  position:absolute;
  width:67px;
  height:67px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  background:
    radial-gradient(circle,
    white 0 10%,
    #62eaff 11% 25%,
    #163b4b 26% 43%,
    #8466ff 44% 62%,
    #17132f 63%);
  box-shadow:0 0 25px rgba(97,234,255,.5);
}

.target.hit{
  animation:targetHit .2s ease-out forwards;
}

@keyframes targetHit{
  from{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
  to{
    transform:translate(-50%,-50%) scale(1.7);
    opacity:0;
  }
}

.laser{
  position:absolute;
  z-index:15;
  height:4px;
  transform-origin:0 50%;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(97,234,255,.05),#62eaff,#fff);
  box-shadow:
    0 0 7px var(--cyan),
    0 0 16px rgba(97,234,255,.8);
  animation:laserFade .18s linear forwards;
}

.laser.lv2{
  height:6px;
  box-shadow:
    0 0 10px var(--cyan),
    0 0 24px rgba(97,234,255,.95);
}

.laser.lv3{
  height:9px;
  background:linear-gradient(90deg,rgba(255,228,107,.05),var(--yellow),white);
  box-shadow:
    0 0 12px var(--yellow),
    0 0 28px rgba(255,228,107,.9);
}

@keyframes laserFade{
  to{opacity:0}
}

.impact{
  position:absolute;
  z-index:18;
  width:72px;
  height:72px;
  transform:translate(-50%,-50%);
  border:2px solid var(--cyan);
  border-radius:50%;
  pointer-events:none;
  animation:impact .25s ease-out forwards;
}

.impact.miss{
  border-color:var(--red);
}

@keyframes impact{
  from{
    opacity:1;
    transform:translate(-50%,-50%) scale(.3);
  }
  to{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.6);
  }
}

.spark{
  position:absolute;
  z-index:19;
  width:5px;
  height:5px;
  border-radius:50%;
  pointer-events:none;
  background:#fff;
  box-shadow:0 0 9px var(--cyan);
  animation:spark .32s ease-out forwards;
}

@keyframes spark{
  from{
    opacity:1;
    transform:translate(0,0) scale(1);
  }
  to{
    opacity:0;
    transform:translate(var(--sx),var(--sy)) scale(.2);
  }
}

.weapon-level{
  position:absolute;
  top:14px;
  left:14px;
  z-index:30;
  padding:8px 11px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(5,8,14,.65);
  color:#fff;
  font-size:11px;
  font-weight:1000;
  backdrop-filter:blur(7px);
}


/* JOYSTICK */

.mobile-controls{
  display:none;
}

.joystick{
  position:absolute;
  left:18px;
  bottom:18px;
  width:115px;
  height:115px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  background:rgba(255,255,255,.045);
  backdrop-filter:blur(6px);
  touch-action:none;
}

.joystick-knob{
  position:absolute;
  width:48px;
  height:48px;
  left:33.5px;
  top:33.5px;
  border-radius:50%;
  background:linear-gradient(180deg,#edfaff,#75eaff);
  box-shadow:0 0 20px rgba(97,234,255,.35);
}

.fire{
  position:absolute;
  right:22px;
  bottom:28px;
  width:88px;
  height:88px;
  border:0;
  border-radius:50%;
  background:linear-gradient(180deg,#ff7691,#ff3e63);
  color:#fff;
  font-size:15px;
  font-weight:1000;
  box-shadow:0 0 26px rgba(255,62,99,.3);
  touch-action:none;
}


/* START */

.start-screen{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 20%,rgba(97,234,255,.08),transparent 35%),
    #070a11;
}

.start-inner{
  text-align:center;
  padding:30px;
}

.start-kicker{
  color:var(--cyan);
  font-size:11px;
  font-weight:1000;
  letter-spacing:.23em;
}

.start-title{
  margin:15px 0 20px;
  font-size:clamp(44px,7vw,85px);
  line-height:1.04;
  letter-spacing:-.045em;
}

.start-copy{

<script>

(() => {

const $ = id => document.getElementById(id);

const feed = $("feed");
const startScreen = $("startScreen");

let currentCard = $("cardA");
let nextCard = $("cardB");

let currentGame = null;
let nextGame = null;

let played = 0;
let gamiq = null;

let canSwipe = false;
let swipeUnlockAt = 0;

let gameActive = false;
let finishCurrentGame = null;

let cleanupFns = [];
let gameEndTimer = null;

let bag = [];
let lastGameId = null;

const skillScores = {
  REFLEX: [],
  SPEED: [],
  AIM: [],
  LOGIC: [],
  MEMORY: [],
  ADAPT: []
};


/* ==================================================
GAME POOL
================================================== */

const games = [

{
  id:"reaction",
  title:"FLASH",
  rule:"光った瞬間だけ押せ",
  skill:"REFLEX",
  duration:8000,
  start:reactionGame
},

{
  id:"green",
  title:"GREEN",
  rule:"緑だけ押せ。赤は押すな",
  skill:"REFLEX",
  duration:8500,
  start:greenGame
},

{
  id:"tap",
  title:"BOOST",
  rule:"連打してエネルギーを溜めろ",
  skill:"SPEED",
  duration:8000,
  start:tapGame
},

{
  id:"alternate",
  title:"LEFT / RIGHT",
  rule:"左右交互に高速タップ",
  skill:"SPEED",
  duration:8000,
  start:alternateGame
},

{
  id:"aim",
  title:"SHOOT",
  rule:"照準を合わせて撃て",
  skill:"AIM",
  duration:10000,
  start:aimStaticGame
},

{
  id:"aimmove",
  title:"TRACK",
  rule:"動くターゲットを撃て",
  skill:"AIM",
  duration:10000,
  start:aimMovingGame
},

{
  id:"highlow",
  title:"HIGH",
  rule:"大きい数字を選べ",
  skill:"LOGIC",
  duration:8000,
  start:highLowGame
},

{
  id:"condition",
  title:"RULE SWITCH",
  rule:"表示された条件に従え",
  skill:"LOGIC",
  duration:8500,
  start:conditionGame
},

{
  id:"sequence",
  title:"SEQUENCE",
  rule:"光った順番を再現",
  skill:"MEMORY",
  duration:10000,
  start:sequenceGame
},

{
  id:"position",
  title:"POSITION",
  rule:"光った場所を覚えろ",
  skill:"MEMORY",
  duration:9000,
  start:positionGame
}

];


/* ==================================================
UTIL
================================================== */

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function avg(values){

  if(!values.length){
    return null;
  }

  return values.reduce(
    (a,b)=>a+b,
    0
  ) / values.length;
}

function shuffle(array){

  const a = [...array];

  for(let i=a.length-1;i>0;i--){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]] =
    [a[j],a[i]];

  }

  return a;
}

function shake(){

  feed.classList.remove("shake");

  void feed.offsetWidth;

  feed.classList.add("shake");

}

function missFlash(){

  feed.classList.remove("miss-flash");

  void feed.offsetWidth;

  feed.classList.add("miss-flash");

}

function showFeedback(
  board,
  text,
  type="good"
){

  const el =
    document.createElement("div");

  el.className =
    `feedback ${type}`;

  el.textContent =
    text;

  board.appendChild(el);

  setTimeout(
    () => el.remove(),
    520
  );

}

function showCombo(
  board,
  combo
){

  board
    .querySelectorAll(".combo")
    .forEach(el=>el.remove());


  if(combo < 2){
    return;
  }


  const el =
    document.createElement("div");

  el.className =
    "combo";

  el.innerHTML =
    `COMBO <strong>×${combo}</strong>`;

  board.appendChild(el);

  setTimeout(
    () => {

      if(el.isConnected){
        el.remove();
      }

    },
    700
  );

}

function successFeedback(
  board,
  combo
){

  shake();

  showCombo(
    board,
    combo
  );


  if(combo >= 8){

    showFeedback(
      board,
      "PERFECT",
      "perfect"
    );

  }
  else if(combo >= 4){

    showFeedback(
      board,
      "GREAT",
      "great"
    );

  }
  else{

    showFeedback(
      board,
      "GOOD",
      "good"
    );

  }

}

function failFeedback(board){

  missFlash();

  showFeedback(
    board,
    "MISS",
    "miss"
  );

}


/* ==================================================
RANDOM BAG
================================================== */

function getNextGame(){

  if(!bag.length){

    bag =
      shuffle(games);

  }

  let game =
    bag.shift();


  if(
    game.id === lastGameId &&
    bag.length
  ){

    const second =
      bag.shift();

    bag.push(game);

    game = second;

  }

  lastGameId =
    game.id;

  return game;
}


/* ==================================================
CARD
================================================== */

function renderCard(
  card,
  game,
  previewOnly=false
){

  card.innerHTML = `

    <div class="card-content">

      <div class="game-head">

        <div>

          <div class="game-number">
            GAME ${played + (previewOnly ? 2 : 1)}
          </div>

          <h2 class="game-title">
            ${game.title}
          </h2>

        </div>

        <div class="skill-badge">
          ${game.skill}
        </div>

      </div>


      <div class="board">

        <div class="play"></div>


        <div class="rule">

          <div class="rule-inner">

            <div class="rule-label">
              ${game.skill}
            </div>

            <div class="rule-text">
              ${game.rule}
            </div>

            <div class="rule-bar">
              <div class="rule-bar-fill"></div>
            </div>

          </div>

        </div>


        <div class="finish">

          <div>

            <div class="finish-score">
              <span class="finish-score-value">
                +0
              </span>
            </div>

            <div class="finish-skill">
              ${game.skill}
            </div>

            <div class="swipe-hint">

              <span class="swipe-arrow">
                ↑
              </span>

              SWIPE UP

            </div>

          </div>

        </div>

      </div>

    </div>

  `;

}


/* ==================================================
FLOW
================================================== */

function start(){

  startScreen.style.display =
    "none";

  currentGame =
    getNextGame();

  nextGame =
    getNextGame();


  renderCard(
    currentCard,
    currentGame,
    false
  );

  renderCard(
    nextCard,
    nextGame,
    true
  );

  beginCurrentGame();

}

function beginCurrentGame(){

  cleanupGame();

  canSwipe = false;

  gameActive = false;


  const rule =
    currentCard
      .querySelector(".rule");


  const bar =
    currentCard
      .querySelector(".rule-bar-fill");


  rule.style.display =
    "flex";


  bar.classList.remove("go");

  void bar.offsetWidth;

  bar.classList.add("go");


  const ruleTimer =
    setTimeout(
      () => {

        rule.style.display =
          "none";


        gameActive =
          true;


        const play =
          currentCard
            .querySelector(".play");


        finishCurrentGame =
          currentGame.start(play);


        gameEndTimer =
          setTimeout(
            finishGame,
            currentGame.duration
          );

      },
      900
    );


  cleanupFns.push(
    () => clearTimeout(ruleTimer)
  );

}

function finishGame(){

  if(!gameActive){
    return;
  }

  gameActive =
    false;


  const result =
    finishCurrentGame
    ? finishCurrentGame()
    : {
        score:0,
        adapt:50
      };


  const score =
    clamp(
      Math.round(
        result.score || 0
      ),
      0,
      100
    );


  const adapt =
    clamp(
      Math.round(
        result.adapt ?? 50
      ),
      0,
      100
    );


  skillScores[
    currentGame.skill
  ].push(score);


  skillScores.ADAPT.push(
    adapt
  );


  played++;


  updateGamiq();


  const finish =
    currentCard
      .querySelector(".finish");


  finish
    .querySelector(
      ".finish-score-value"
    )
    .textContent =
      `+${score}`;


  finish.classList.add("show");


  swipeUnlockAt =
    performance.now()+500;


  setTimeout(
    () => {

      canSwipe = true;

    },
    500
  );

}


/* ==================================================
GAMIQ
================================================== */

function updateGamiq(){

  const keys = [
    "REFLEX",
    "SPEED",
    "AIM",
    "LOGIC",
    "MEMORY"
  ];


  const available =
    keys
      .map(
        key =>
          avg(skillScores[key])
      )
      .filter(
        value =>
          value !== null
      );


  const base =
    available.length
    ? avg(available)
    : 50;


  const adapt =
    avg(skillScores.ADAPT);


  const combined =
    adapt === null
    ? base
    : base*.85
      + adapt*.15;


  const newGamiq =
    Math.round(
      300
      + combined*7
    );


  const old =
    gamiq;


  gamiq =
    newGamiq;


  const confidence =
    Math.min(
      99,
      Math.round(
        100 *
        (
          1 -
          Math.exp(
            -played/18
          )
        )
      )
    );


  updateHud(
    confidence,
    old
  );

}

function updateHud(
  confidence,
  previous
){

  $("playedTop").textContent =
    played;

  $("playedSide").textContent =
    played;


  $("gamiqTop").textContent =
    gamiq ?? "---";

  $("gamiqSide").textContent =
    gamiq ?? "---";


  $("confidenceTop").textContent =
    confidence+"%";

  $("confidenceSide").textContent =
    confidence+"%";

  $("confidenceFill").style.width =
    confidence+"%";


  const map = {
    REFLEX:"skillReflex",
    SPEED:"skillSpeed",
    AIM:"skillAim",
    LOGIC:"skillLogic",
    MEMORY:"skillMemory",
    ADAPT:"skillAdapt"
  };


  Object.entries(map)
    .forEach(
      ([key,id]) => {

        const value =
          avg(skillScores[key]);


        $(id).textContent =
          value === null
          ? "--"
          : Math.round(value);

      }
    );


  if(
    previous !== null &&
    previous !== undefined
  ){

    const el =
      $("gamiqTop");


    el.classList.remove(
      "flash-up",
      "flash-down"
    );


    void el.offsetWidth;


    if(gamiq > previous){

      el.classList.add(
        "flash-up"
      );

    }
    else if(
      gamiq < previous
    ){

      el.classList.add(
        "flash-down"
      );

    }

  }

}


/* ==================================================
SWIPE
================================================== */

let touchStartY = null;
let touchLastY = null;
let dragging = false;


feed.addEventListener(
  "touchstart",
  event => {

    if(
      !canSwipe ||
      performance.now()
      < swipeUnlockAt
    ){
      return;
    }


    touchStartY =
      event.touches[0].clientY;


    touchLastY =
      touchStartY;


    dragging =
      true;


    currentCard
      .classList
      .remove("animating");


    nextCard
      .classList
      .remove("animating");

  },
  {
    passive:false
  }
);


feed.addEventListener(
  "touchmove",
  event => {

    if(!dragging){
      return;
    }


    event.preventDefault();


    const y =
      event.touches[0].clientY;


    touchLastY =
      y;


    let dy =
      y - touchStartY;


    dy =
      Math.min(
        0,
        dy
      );


    const progress =
      Math.min(
        1,
        Math.abs(dy)
        /
        feed.clientHeight
      );


    currentCard.style.transform =
      `translateY(${dy}px) scale(${1-progress*.04})`;


    currentCard.style.filter =
      `brightness(${1-progress*.2})`;


    nextCard.style.transform =
      `translateY(calc(100% + ${dy}px)) scale(${.98+progress*.02})`;

  },
  {
    passive:false
  }
);


feed.addEventListener(
  "touchend",
  () => {

    if(!dragging){
      return;
    }


    dragging =
      false;


    const dy =
      touchLastY
      - touchStartY;


    if(dy < -75){

      commitSwipe();

    }
    else{

      cancelSwipe();

    }

  },
  {
    passive:false
  }
);

function cancelSwipe(){

  currentCard
    .classList
    .add("animating");


  nextCard
    .classList
    .add("animating");


  currentCard.style.transform =
    "translateY(0) scale(1)";


  currentCard.style.filter =
    "brightness(1)";


  nextCard.style.transform =
    "translateY(100%) scale(.98)";

}

function commitSwipe(){

  if(!canSwipe){
    return;
  }


  canSwipe =
    false;


  currentCard
    .classList
    .add("animating");


  nextCard
    .classList
    .add("animating");


  currentCard.style.transform =
    "translateY(-100%) scale(.95)";


  currentCard.style.opacity =
    ".55";


  currentCard.style.filter =
    "brightness(.7)";


  nextCard.style.transform =
    "translateY(0) scale(1)";


  setTimeout(
    completeSwipe,
    350
  );

}

function completeSwipe(){

  cleanupGame();


  const old =
    currentCard;


  currentCard =
    nextCard;


  nextCard =
    old;


  currentCard.className =
    "card current";


  currentCard.style.transform =
    "translateY(0) scale(1)";


  currentCard.style.opacity =
    "1";


  currentCard.style.filter =
    "brightness(1)";


  nextCard.className =
    "card next";


  nextCard.style.transform =
    "translateY(100%) scale(.98)";


  nextCard.style.opacity =
    "1";


  currentGame =
    nextGame;


  nextGame =
    getNextGame();


  renderCard(
    nextCard,
    nextGame,
    true
  );


  beginCurrentGame();

}


/* ==================================================
DESKTOP NEXT
================================================== */

let wheelLock = false;


window.addEventListener(
  "wheel",
  event => {

    if(
      !canSwipe ||
      wheelLock ||
      event.deltaY < 45
    ){
      return;
    }


    wheelLock =
      true;


    commitSwipe();


    setTimeout(
      () => {
        wheelLock = false;
      },
      700
    );

  },
  {
    passive:true
  }
);


window.addEventListener(
  "keydown",
  event => {

    if(!canSwipe){
      return;
    }


    if(
      event.key ===
      "ArrowDown"
    ){

      commitSwipe();

    }

  }
);


/* ==================================================
CLEANUP
================================================== */

function cleanupGame(){

  cleanupFns
    .forEach(
      fn => {

        try{
          fn();
        }
        catch(e){}

      }
    );


  cleanupFns = [];


  if(gameEndTimer){

    clearTimeout(
      gameEndTimer
    );

    gameEndTimer =
      null;

  }

}


/* ==================================================
ADAPT
================================================== */

function adaptScore(series){

  if(series.length < 4){

    const overall =
      avg(series);


    return overall === null
    ? 50
    : clamp(
        35+overall*.3,
        25,
        75
      );

  }


  const chunk =
    Math.max(
      1,
      Math.floor(
        series.length*.35
      )
    );


  const first =
    avg(
      series.slice(
        0,
        chunk
      )
    );


  const last =
    avg(
      series.slice(
        -chunk
      )
    );


  return clamp(
    50
    + (
      last-first
    )*.9,
    0,
    100
  );

}


/* ==================================================
REACTION
================================================== */

function reactionGame(play){

  let success = 0;
  let falseStart = 0;
  let totalReaction = 0;

  let ready = false;
  let shownAt = 0;

  let timer = null;

  let combo = 0;

  const rounds = [];


  play.innerHTML = `

    <div class="center-game">

      <button
        class="round-button"
        id="reactionBtn"
      >
        WAIT
      </button>

      <span
        class="message"
        id="reactionMsg"
      >
        光ったら押せ
      </span>

    </div>

  `;


  const board =
    play.closest(".board");


  const btn =
    play.querySelector(
      "#reactionBtn"
    );


  const msg =
    play.querySelector(
      "#reactionMsg"
    );


  function schedule(){

    ready = false;


    btn.textContent =
      "WAIT";


    btn.style.filter =
      "brightness(.35)";


    clearTimeout(timer);


    timer =
      setTimeout(
        () => {

          if(!gameActive){
            return;
          }


          ready =
            true;


          shownAt =
            performance.now();


          btn.textContent =
            "GO";


          btn.style.filter =
            "brightness(1.25)";

        },
        450
        + Math.random()*850
      );

  }


  function press(){

    if(!gameActive){
      return;
    }


    if(!ready){

      falseStart++;

      combo = 0;

      rounds.push(0);

      msg.textContent =
        "TOO EARLY";

      failFeedback(board);

      schedule();

      return;

    }


    const reaction =
      performance.now()
      - shownAt;


    success++;

    totalReaction +=
      reaction;


    const score =
      clamp(
        100
        - (
          reaction-180
        )/5,
        0,
        100
      );


    rounds.push(score);


    if(score >= 55){

      combo++;

      successFeedback(
        board,
        combo
      );

    }
    else{

      combo = 0;

    }


    msg.textContent =
      Math.round(reaction)
      +" ms";


    schedule();

  }


  btn.addEventListener(
    "pointerdown",
    press
  );


  cleanupFns.push(
    () => {

      clearTimeout(timer);


      btn.removeEventListener(
        "pointerdown",
        press
      );

    }
  );


  schedule();


  return () => {

    const reaction =
      success
      ? totalReaction/success
      : 1000;


    const score =
      clamp(
        100
        - (
          reaction-180
        )/5
        - falseStart*8,
        0,
        100
      );


    return {
      score,
      adapt:
        adaptScore(rounds)
    };

  };

}

    );

      "#tapCount"
    );


  const fill =
    play.querySelector(
      "#energyFill"
    );


  const boost =
    play.querySelector(
      "#boostLabel"
    );


  const chunkTimer =
    setInterval(
      () => {

        chunks.push(
          clamp(
            currentChunk*14,
            0,
            100
          )
        );


        currentChunk = 0;

      },
      1000
    );


  function press(){

    if(!gameActive){

    }


    count++;

    countEl.textContent =
      count;


    const percent =
      Math.min(
        100,
        count/75*100
      );


    fill.style.width =
      percent+"%";


    const oldLevel =
      boostLevel;


    if(count >= 55){

      boostLevel = 3;

      boost.textContent =
        "MAX BOOST";

    }
    else if(count >= 35){

      boostLevel = 2;

      boost.textContent =
        "BOOST ×2";

    }
    else if(count >= 18){

      boostLevel = 1;

      boost.textContent =
        "BOOST";

    }


    if(
      boostLevel > oldLevel
    ){

      successFeedback(
        board,
        boostLevel*3
      );

    }

  }


  btn.addEventListener(
    "pointerdown",
    press
  );


  cleanupFns.push(
    () => {

      clearInterval(
        chunkTimer
      );


      btn.removeEventListener(
        "pointerdown",
        press
      );

    }
  );


  return () => {

    clearInterval(
      chunkTimer
    );


    chunks.push(
      clamp(
        currentChunk*14,
        0,
        100
      )
    );


    return {

      score:
        clamp(
          count/1.05,
          0,
          100
        ),

      adapt:
        adaptScore(chunks)

    };

  };

}

/* ==================================================
AIM ENGINE
================================================== */

function aimEngine(
  play,
  moving
){

  let targetX = 0;
  let targetY = 0;

  let crossX = 0;
  let crossY = 0;

  let targetSize =
    moving ? 58 : 65;

  let shots = 0;
  let hits = 0;

  let reactionTotal = 0;

  let shownAt = 0;

  let moveRAF = null;
  let joystickRAF = null;

  let vx = 2;
  let vy = 1.5;

  let joyX = 0;
  let joyY = 0;

  let combo = 0;
  let weaponLevel = 1;

  const rounds = [];


  play.innerHTML = `

    <div
      class="aim"
      id="aimBoard"
    >

      <div
        class="weapon-level"
        id="weaponLevel"
      >
        WEAPON LV.1
      </div>

      <div
        class="target"
        id="target"
      ></div>

      <div
        class="crosshair"
        id="crosshair"
      >
        <div class="crosshair-center"></div>
      </div>


      <div class="mobile-controls">

        <div
          class="joystick"
          id="joystick"
        >

          <div
            class="joystick-knob"
            id="joyKnob"
          ></div>

        </div>

        <button
          class="fire"
          id="fireBtn"
        >
          FIRE
        </button>

      </div>

    </div>

  `;


  const board =
    play.querySelector(
      "#aimBoard"
    );


  const outerBoard =
    play.closest(".board");


  const target =
    play.querySelector(
      "#target"
    );


  const crosshair =
    play.querySelector(
      "#crosshair"
    );


  const joystick =
    play.querySelector(
      "#joystick"
    );


  const knob =
    play.querySelector(
      "#joyKnob"
    );


  const fireBtn =
    play.querySelector(
      "#fireBtn"
    );


  const levelEl =
    play.querySelector(
      "#weaponLevel"
    );


  function size(){

    const r =
      board
        .getBoundingClientRect();


    return {
      w:r.width,
      h:r.height
    };

  }


  function renderCross(){

    crosshair.style.left =
      crossX+"px";


    crosshair.style.top =
      crossY+"px";

  }


  function spawn(){

    if(!gameActive){
      return;
    }


    const s =
      size();


    targetX =
      50
      + Math.random()
      * Math.max(
          20,
          s.w-100
        );


    targetY =
      50
      + Math.random()
      * Math.max(
          20,
          s.h-130
        );


    target.style.left =
      targetX+"px";


    target.style.top =
      targetY+"px";


    target.style.width =
      targetSize+"px";


    target.style.height =
      targetSize+"px";


    target.style.opacity =
      "1";


    target.classList.remove(
      "hit"
    );


    shownAt =
      performance.now();


    vx =
      (
        Math.random()<.5
        ? -1
        : 1
      )
      *
      (
        1.6
        + Math.random()*1.4
      );


    vy =
      (
        Math.random()<.5
        ? -1
        : 1
      )
      *
      (
        1
        + Math.random()*1.1
      );

  }


  function createSparks(
    x,
    y
  ){

    for(let i=0;i<7;i++){

      const spark =
        document
          .createElement(
            "div"
          );


      spark.className =
        "spark";


      spark.style.left =
        x+"px";


      spark.style.top =
        y+"px";


      spark.style.setProperty(
        "--sx",
        (
          Math.random()*70
          -35
        )+"px"
      );


      spark.style.setProperty(
        "--sy",
        (
          Math.random()*70
          -35
        )+"px"
      );


      board.appendChild(
        spark
      );


      setTimeout(
        () => spark.remove(),
        350
      );

    }

  }


  function laser(
    x,
    y,
    hit
  ){

    const s =
      size();


    const sx =
      s.w/2;


    const sy =
      s.h-8;


    const dx =
      x-sx;


    const dy =
      y-sy;


    const length =
      Math.sqrt(
        dx*dx
        +
        dy*dy
      );


    const angle =
      Math.atan2(
        dy,
        dx
      )
      *180/Math.PI;


    const beam =
      document
        .createElement(
          "div"
        );


    beam.className =
      "laser";


    if(weaponLevel === 2){

      beam.classList.add(
        "lv2"
      );

    }


    if(weaponLevel >= 3){

      beam.classList.add(
        "lv3"
      );

    }


    beam.style.left =
      sx+"px";


    beam.style.top =
      sy+"px";


    beam.style.width =
      length+"px";


    beam.style.transform =
      `rotate(${angle}deg)`;


    board.appendChild(
      beam
    );


    const impact =
      document
        .createElement(
          "div"
        );


    impact.className =
      hit
      ? "impact"
      : "impact miss";


    impact.style.left =
      x+"px";


    impact.style.top =
      y+"px";


    board.appendChild(
      impact
    );


    if(hit){

      createSparks(
        x,
        y
      );

    }


    setTimeout(
      () => {

        beam.remove();

        impact.remove();

      },
      280
    );

  }


  function fire(){

    if(!gameActive){
      return;
    }


    shots++;


    const distance =
      Math.hypot(
        crossX-targetX,
        crossY-targetY
      );


    const hit =
      distance
      <= targetSize/2;


    laser(
      crossX,
      crossY,
      hit
    );


    if(hit){

      hits++;

      combo++;


      if(combo >= 6){

        weaponLevel = 3;

      }
      else if(combo >= 3){

        weaponLevel = 2;

      }
      else{

        weaponLevel = 1;

      }


      levelEl.textContent =
        "WEAPON LV."
        + weaponLevel;


      successFeedback(
        outerBoard,
        combo
      );


      target.classList.add(
        "hit"
      );


      const reaction =
        performance.now()
        - shownAt;


      reactionTotal +=
        reaction;


      rounds.push(
        clamp(
          100
          - (
            reaction-350
          )/22,
          0,
          100
        )
      );


      setTimeout(
        spawn,
        110
      );

    }
    else{

      combo = 0;

      weaponLevel = 1;


      levelEl.textContent =
        "WEAPON LV.1";


      rounds.push(0);


      failFeedback(
        outerBoard
      );

    }

  }


  function mouseMove(event){

    if(
      window.innerWidth
      <= 900
    ){
      return;
    }


    const r =
      board
        .getBoundingClientRect();


    crossX =
      event.clientX-r.left;


    crossY =
      event.clientY-r.top;


    renderCross();

  }


  function desktopFire(event){

    if(
      window.innerWidth
      <= 900
    ){
      return;
    }


    event.preventDefault();

    fire();

  }


  function joystickMove(event){

    if(
      window.innerWidth
      > 900
    ){
      return;
    }


    event.preventDefault();


    const touch =
      event.touches
      ? event.touches[0]
      : event;


    const r =
      joystick
        .getBoundingClientRect();


    const cx =
      r.left+r.width/2;


    const cy =
      r.top+r.height/2;


    let dx =
      touch.clientX-cx;


    let dy =
      touch.clientY-cy;


    const max = 32;


    const length =
      Math.hypot(
        dx,
        dy
      );


    if(length > max){

      dx =
        dx/length*max;


      dy =
        dy/length*max;

    }


    joyX =
      dx/max;


    joyY =
      dy/max;


    knob.style.transform =
      `translate(${dx}px,${dy}px)`;

  }


  function joystickEnd(){

    joyX = 0;
    joyY = 0;


    knob.style.transform =
      "translate(0,0)";

  }


  function joystickLoop(){

    if(gameActive){

      const s =
        size();


      crossX =
        clamp(
          crossX+joyX*5.5,
          0,
          s.w
        );


      crossY =
        clamp(
          crossY+joyY*5.5,
          0,
          s.h
        );


      renderCross();

    }


    joystickRAF =
      requestAnimationFrame(
        joystickLoop
      );

  }


  function moveTarget(){

    if(
      gameActive &&
      moving
    ){

      const s =
        size();


      targetX += vx;

      targetY += vy;


      const r =
        targetSize/2;


      if(
        targetX < r ||
        targetX > s.w-r
      ){

        vx *= -1;

      }


      if(
        targetY < r ||
        targetY > s.h-r-90
      ){

        vy *= -1;

      }


      targetX =
        clamp(
          targetX,
          r,
          s.w-r
        );


      targetY =
        clamp(
          targetY,
          r,
          s.h-r-90
        );


      target.style.left =
        targetX+"px";


      target.style.top =
        targetY+"px";

    }


    moveRAF =
      requestAnimationFrame(
        moveTarget
      );

  }


  const s =
    size();


  crossX =
    s.w/2;


  crossY =
    s.h/2;


  renderCross();

  spawn();


  board.addEventListener(
    "mousemove",
    mouseMove
  );


  board.addEventListener(
    "pointerdown",
    desktopFire
  );


  joystick.addEventListener(
    "touchstart",
    joystickMove,
    {
      passive:false
    }
  );


  joystick.addEventListener(
    "touchmove",
    joystickMove,
    {
      passive:false
    }
  );


  joystick.addEventListener(
    "touchend",
    joystickEnd
  );


  fireBtn.addEventListener(
    "pointerdown",
    event => {

      event.stopPropagation();

      fire();

    }
  );


  joystickLoop();

  moveTarget();


  cleanupFns.push(
    () => {

      board.removeEventListener(
        "mousemove",
        mouseMove
      );


      board.removeEventListener(
        "pointerdown",
        desktopFire
      );


      joystick.removeEventListener(
        "touchstart",
        joystickMove
      );


      joystick.removeEventListener(
        "touchmove",
        joystickMove
      );


      joystick.removeEventListener(
        "touchend",
        joystickEnd
      );


      cancelAnimationFrame(
        joystickRAF
      );


      cancelAnimationFrame(
        moveRAF
      );

    }
  );


  return () => {

    if(!shots){

      return {
        score:0,
        adapt:50
      };

    }


    const accuracy =
      hits/shots;


    const reaction =
      hits
      ? reactionTotal/hits
      : 2000;


    return {

      score:
        clamp(
          accuracy*70
          +
          Math.max(
            0,
            30
            - (
              reaction-400
            )/45
          ),
          0,
          100
        ),

      adapt:
        adaptScore(rounds)

    };

  };

}

function aimStaticGame(play){

  return aimEngine(
    play,
    false
  );

}

function aimMovingGame(play){

  return aimEngine(
    play,
    true
  );

}

function highLowGame(play){

  let correct = 0;
  let attempts = 0;

  let combo = 0;

  const rounds = [];


  function next(){

    if(!gameActive){
      return;
    }


    let a =
      Math.floor(
        Math.random()*90
      )+10;


    let b =
      Math.floor(
        Math.random()*90
      )+10;


    while(a === b){

      b =
        Math.floor(
          Math.random()*90
        )+10;

    }


    const answer =
      Math.max(a,b);


    play.innerHTML = `

      <div class="choice-wrap">

        <button
          class="choice"
          data-value="${a}"
        >
          ${a}
        </button>

        <button
          class="choice"
          data-value="${b}"
        >
          ${b}
        </button>

    const board =
      play.closest(".board");


    play
      .querySelectorAll(
        ".choice"
      )
      .forEach(
        btn => {

          btn.addEventListener(
            "pointerdown",
            () => {

              if(!gameActive){
                return;
              }


              attempts++;


              const good =
                Number(
                  btn.dataset.value
                )
                === answer;


              if(good){

                correct++;

                combo++;

                rounds.push(100);


                btn.classList.add(
                  "correct-pop"
                );


                successFeedback(
                  board,
                  combo
                );


                setTimeout(

                combo = 0;

                rounds.push(0);


                failFeedback(
                  board
                );


                setTimeout(
                  next,
                  120
                );

              }

            },
            {
              once:true
            }
          );

        }
      );

  }


  next();


  return () => ({

    score:
      attempts
      ? clamp(
          correct/attempts*70
          + attempts*2.2,
          0,
          100
        )
      : 0,

    adapt:
      adaptScore(rounds)

  });

}

function conditionGame(play){

  let correct = 0;
  let attempts = 0;

  let combo = 0;

  const rounds = [];


  const rules = [

    {
      label:"大きい方",
      answer:(a,b)=>Math.max(a,b)
    },

    {
      label:"小さい方",
      answer:(a,b)=>Math.min(a,b)
    },

    {
      label:"偶数",
      answer:(a,b)=>
        a%2===0 ? a : b
    }

  ];


  function next(){

    if(!gameActive){
      return;
    }


    const rule =
      rules[
        Math.floor(
          Math.random()
          * rules.length

      a =
        Math.floor(
          Math.random()*40
        )*2+2;


      b =
        Math.floor(
          Math.random()*40
        )*2+1;


      if(Math.random() < .5){

        [a,b] = [b,a];

      }

    }
    else{

      a =
        Math.floor(
          Math.random()*90
        )+10;


      b =
        Math.floor(
          Math.random()*90
        )+10;


      while(a === b){
        b++;
      }

    }


    const answer =
      rule.answer(a,b);


    play.innerHTML = `

      <div class="center-game">

        <div class="logic-label">
          ${rule.label}
        </div>

        <div class="choice-wrap">

          <button
            class="choice"
            data-value="${a}"
          >
            ${a}
          </button>

          <button
            class="choice"
            data-value="${b}"
          >
            ${b}
          </button>

        </div>

      </div>

    `;


    const board =
      play.closest(".board");


    play
      .querySelectorAll(
        ".choice"
      )
      .forEach(
        btn => {

          btn.addEventListener(
            "pointerdown",
            () => {

              if(!gameActive){
                return;
              }


              attempts++;


              const good =
                Number(
                  btn.dataset.value
                )
                === answer;


              if(good){

                correct++;

                combo++;

                rounds.push(100);

                btn.classList.add(
                  "correct-pop"
                );

                successFeedback(
                  board,
                  combo
                );

              }
              else{

                combo = 0;

                rounds.push(0);

                failFeedback(
                  board
                );

              }


              setTimeout(
                next,
                good ? 180 : 120
              );

            },
            {
              once:true
            }
          );

        }
      );

  }


  next();


  return () => ({

    score:
      attempts
      ? clamp(
          correct/attempts*70
          + attempts*2,
          0,
          100
        )
      : 0,

    adapt:
      adaptScore(rounds)

  });

}


/* ==================================================
SEQUENCE
================================================== */

function sequenceGame(play){

  let rounds = 0;
  let success = 0;

  let sequence = [];

  let inputIndex = 0;

  let accepting = false;

  let timers = [];

  let combo = 0;

  const roundScores = [];


  play.innerHTML = `

    <div class="center-game">

      <div class="memory-grid">

        ${Array.from(
          {length:9},
          (_,i)=>`
            <button
              class="memory-cell"
              data-index="${i}"
            ></button>
          `
        ).join("")}

      </div>

      <span
        class="message"
        id="seqMsg"
      >
        覚えろ
      </span>

    </div>

  `;


  const board =
    play.closest(".board");


  const cells =
    [...play.querySelectorAll(
      ".memory-cell"
    )];


  const msg =
    play.querySelector(
      "#seqMsg"
    );


  function clearTimers(){

    timers.forEach(
      clearTimeout
    );

    timers = [];

  }


  function flash(
    cell,
    className
  ){

    cell.classList.add(
      className
    );


    setTimeout(
      () =>
        cell.classList.remove(
          className
        ),
      130
    );

  }


  function round(){

    clearTimers();

    accepting = false;

    inputIndex = 0;


    const len =
      Math.min(
        5,
        3
        + Math.floor(
            rounds/2
          )
      );


    sequence =
      Array.from(
        {length:len},
        () =>
          Math.floor(
            Math.random()*9
          )
      );


    msg.textContent =
      "覚えろ";


    let delay = 180;


    sequence.forEach(
      index => {

        timers.push(
          setTimeout(
            () =>
              cells[index]
                .classList
                .add("demo"),
            delay
          )
        );


        timers.push(
          setTimeout(
            () =>
              cells[index]
                .classList
                .remove("demo"),
            delay+190
          )
        );


        delay += 290;

      }
    );


    timers.push(
      setTimeout(
        () => {

          accepting = true;

          msg.textContent =
            "再現";

        },
        delay+50
      )
    );

  }


  const handlers =
    cells.map(
      cell => {

        const fn =
          () => {

            if(
              !gameActive ||
              !accepting
            ){
              return;
            }


            const index =
              Number(
                cell.dataset.index
              );


            const good =
              index
              ===
              sequence[inputIndex];


            flash(
              cell,
              good
              ? "correct"
              : "wrong"
            );


            if(good){

              inputIndex++;


              if(
                inputIndex
                === sequence.length
              ){

                success++;

                rounds++;

                combo++;

                roundScores.push(100);

                accepting = false;

                msg.textContent =
                  "CLEAR";


                successFeedback(
                  board,
                  combo
                );


                timers.push(
                  setTimeout(
                    round,
                    300
                  )
                );

              }

            }
            else{

              rounds++;

              combo = 0;

              roundScores.push(0);

              accepting = false;

              msg.textContent =
                "MISS";


              failFeedback(
                board
              );


              timers.push(
                setTimeout(
                  round,
                  350
                )
              );

            }

          };


        cell.addEventListener(
          "pointerdown",
          fn
        );


        return {
          cell,
          fn
        };

      }
    );


  cleanupFns.push(
    () => {

      clearTimers();


      handlers.forEach(
        item =>
          item.cell
            .removeEventListener(
              "pointerdown",
              item.fn
            )
      );

    }
  );


  round();


  return () => ({

    score:
      rounds
      ? clamp(
          success/rounds*85
          + success*5,
          0,
          100
        )
      : 0,

    adapt:
      adaptScore(
        roundScores
      )

  });

}


/* ==================================================
POSITION
================================================== */

function positionGame(play){

  let rounds = 0;
  let success = 0;

  let targets =
    new Set();

  let selected =
    new Set();

  let accepting = false;

  let timer = null;

  let combo = 0;

  const roundScores = [];


  play.innerHTML = `

    <div class="center-game">

      <div class="position-grid">

        ${Array.from(
          {length:16},
          (_,i)=>`
            <button
              class="position-cell"
              data-index="${i}"
            ></button>
          `
        ).join("")}

      </div>

      <span
        class="message"
        id="posMsg"
      >
        覚えろ
      </span>

    </div>

  `;


  const board =
    play.closest(".board");


  const cells =
    [...play.querySelectorAll(
      ".position-cell"
    )];


  const msg =
    play.querySelector(
      "#posMsg"
    );


  function round(){

    selected =
      new Set();


    targets =
      new Set();


    accepting = false;


    cells.forEach(
      cell =>
        cell.className =
          "position-cell"
    );


    while(
      targets.size < 4
    ){

      targets.add(
        Math.floor(
          Math.random()*16
        )
      );

    }


    targets.forEach(
      index =>
        cells[index]
          .classList
          .add("preview")
    );


    msg.textContent =
      "覚えろ";


    timer =
      setTimeout(
        () => {

          cells.forEach(
            cell =>
              cell.classList
                .remove("preview")
          );


          accepting = true;

          msg.textContent =
            "再現";

        },
        650
      );

  }


  const handlers =
    cells.map(
      cell => {

        const fn =
          () => {

            if(
              !gameActive ||
              !accepting
            ){
              return;
            }


            const index =
              Number(
                cell.dataset.index
              );


            if(
              selected.has(index)
            ){
              return;
            }


            selected.add(index);


            const good =
              targets.has(index);


            cell.classList.add(
              good
              ? "correct"
              : "wrong"
            );


            if(!good){

              failFeedback(
                board
              );

            }


            if(
              selected.size === 4
            ){

              rounds++;


              let correctCount = 0;


              selected.forEach(
                value => {

                  if(
                    targets.has(value)
                  ){
                    correctCount++;
                  }

                }
              );


              const roundScore =
                correctCount/4*100;


              roundScores.push(
                roundScore
              );


              if(
                correctCount === 4
              ){

                success++;

                combo++;


                successFeedback(
                  board,
                  combo
                );

              }
              else{

                combo = 0;

              }


              accepting = false;


              msg.textContent =
                correctCount === 4
                ? "CLEAR"
                : `${correctCount}/4`;


              timer =
                setTimeout(
                  round,
                  350
                );

            }

          };


        cell.addEventListener(
          "pointerdown",
          fn
        );


        return {
          cell,
          fn
        };

      }
    );


  cleanupFns.push(
    () => {

      clearTimeout(timer);


      handlers.forEach(
        item =>
          item.cell
            .removeEventListener(
              "pointerdown",
              item.fn
            )
      );

    }
  );


  round();


  return () => ({

    score:
      rounds
      ? clamp(
          success/rounds*90
          + success*4,
          0,
          100
        )
      : 0,

    adapt:
      adaptScore(
        roundScores
      )

  });

}
